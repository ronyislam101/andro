<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Balance - ICE FISHING Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            text-align: center;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .placeholder {
            width: 80px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-card .number.blue { color: #4dc9f6; }
        .stat-card .number.gold { color: #ffd700; }
        .stat-card .number.green { color: #00ff88; }
        .stat-card .number.orange { color: #ffa500; }

        .stat-card .label {
            font-size: 0.55rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Search */
        .search-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-row input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: 0.3s;
            min-width: 200px;
        }

        .search-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .search-row input:focus {
            border-color: rgba(77, 201, 246, 0.15);
        }

        /* Table */
        .table-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .table-section .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-section .title-row .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .table-section .title-row .count {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        td .user-name {
            color: #ffffff;
            font-weight: 500;
        }

        td .balance {
            color: #ffd700;
            font-weight: 600;
        }

        td .key-text {
            font-family: monospace;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.55rem;
            letter-spacing: 0.5px;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .action-btn.add-btn {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .action-btn.add-btn:hover {
            background: rgba(0, 255, 136, 0.12);
        }

        .action-btn.remove-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.remove-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .action-btn.view-btn {
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
        }

        .action-btn.view-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #0e1525;
            border: 1px solid #1a2540;
            border-radius: 20px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal .modal-header h2 {
            font-size: 1.1rem;
        }

        .modal .modal-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .modal-header .close-btn:hover {
            color: #ffffff;
        }

        .modal .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            align-items: center;
        }

        .modal .detail-row .label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal .detail-row .value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .modal .detail-row .value.gold {
            color: #ffd700;
        }

        .modal .balance-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal .balance-section .balance-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .modal .balance-section .current-balance {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 12px;
        }

        .modal .balance-section .balance-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .modal .balance-section .balance-input-group input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            min-width: 120px;
        }

        .modal .balance-section .balance-input-group input:focus {
            border-color: rgba(77, 201, 246, 0.15);
        }

        .modal .balance-section .balance-input-group .btn-add {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #080c18;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .balance-section .balance-input-group .btn-add:hover {
            transform: translateY(-2px);
        }

        .modal .balance-section .balance-input-group .btn-remove {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff6b6b, #cc4444);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .balance-section .balance-input-group .btn-remove:hover {
            transform: translateY(-2px);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .placeholder {
                display: none;
            }
            table {
                font-size: 0.6rem;
            }
            th, td {
                padding: 6px 6px;
            }
            .search-row {
                flex-direction: column;
            }
            .search-row input {
                min-width: unset;
            }
            .modal {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card .number {
                font-size: 1.2rem;
            }
            .header h1 {
                font-size: 1rem;
            }
            .table-section {
                padding: 14px 12px;
            }
            .modal {
                padding: 16px;
            }
            .modal .balance-section .balance-input-group {
                flex-direction: column;
            }
            .modal .balance-section .balance-input-group input {
                width: 100%;
            }
            .modal .balance-section .balance-input-group .btn-add,
            .modal .balance-section .balance-input-group .btn-remove {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>💳 <span>User</span> Balance</h1>
            <div class="placeholder"></div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="number blue" id="totalUsers">0</div>
                <div class="label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="number gold" id="totalBalance">$0</div>
                <div class="label">Total Balance</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="avgBalance">$0</div>
                <div class="label">Average Balance</div>
            </div>
            <div class="stat-card">
                <div class="number orange" id="highestBalance">$0</div>
                <div class="label">Highest Balance</div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="🔍 Search by name, email, license key..." oninput="renderTable()" />
        </div>

        <!-- Table -->
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> All Users</span>
                <span class="count" id="userCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User</th>
                            <th>License Key</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">
                                    <i class="fas fa-users"></i>
                                    No users found
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>💳 Manage Balance</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allUsers = [];

        // ============================================================
        // CHECK ADMIN AUTH
        // ============================================================
        function checkAdminAuth() {
            const adminKey = sessionStorage.getItem('adminKey');
            const adminToken = sessionStorage.getItem('adminToken');

            if (!adminKey || !adminToken) {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // LOAD USERS
        // ============================================================
        function loadUsers() {
            db.collection('users')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    allUsers = [];
                    snapshot.forEach((doc) => {
                        allUsers.push({ id: doc.id, ...doc.data() });
                    });
                    updateStats();
                    renderTable();
                })
                .catch((error) => {
                    console.error('Error loading users:', error);
                });
        }

        // ============================================================
        // UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allUsers.length;
            let totalBalance = 0;
            let highest = 0;

            allUsers.forEach(u => {
                const bal = u.walletBalance || 0;
                totalBalance += bal;
                if (bal > highest) highest = bal;
            });

            const avg = total > 0 ? totalBalance / total : 0;

            document.getElementById('totalUsers').textContent = total;
            document.getElementById('totalBalance').textContent = '$' + totalBalance.toFixed(2);
            document.getElementById('avgBalance').textContent = '$' + avg.toFixed(2);
            document.getElementById('highestBalance').textContent = '$' + highest.toFixed(2);
            document.getElementById('userCount').textContent = 'Total: ' + total;
        }

        // ============================================================
        // RENDER TABLE
        // ============================================================
        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('userTableBody');

            let filtered = allUsers;

            if (search) {
                filtered = filtered.filter(u =>
                    (u.name || '').toLowerCase().includes(search) ||
                    (u.email || '').toLowerCase().includes(search) ||
                    (u.userKey || '').toLowerCase().includes(search)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                No users found
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            let index = 1;

            filtered.forEach((user) => {
                const balance = user.walletBalance || 0;

                html += `
                    <tr>
                        <td>${index++}</td>
                        <td>
                            <span class="user-name">${user.name || 'Unknown'}</span>
                            <br />
                            <span style="font-size:0.5rem; color:rgba(255,255,255,0.1);">${user.email || ''}</span>
                        </td>
                        <td><span class="key-text">${user.userKey || '—'}</span></td>
                        <td><span class="balance">$${balance.toFixed(2)}</span></td>
                        <td>
                            <button class="action-btn view-btn" onclick="viewUser('${user.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="action-btn add-btn" onclick="quickAddBalance('${user.id}')">
                                <i class="fas fa-plus"></i>
                            </button>
                            <button class="action-btn remove-btn" onclick="quickRemoveBalance('${user.id}')">
                                <i class="fas fa-minus"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // VIEW USER
        // ============================================================
        function viewUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const modal = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');

            const balance = user.walletBalance || 0;

            body.innerHTML = `
                <div class="detail-row">
                    <span class="label">User</span>
                    <span class="value">${user.name || 'Unknown'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Email</span>
                    <span class="value">${user.email || '—'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">License Key</span>
                    <span class="value" style="color:#ffd700; font-family:monospace;">${user.userKey || '—'}</span>
                </div>

                <div class="balance-section">
                    <div class="balance-label">💰 Current Balance</div>
                    <div class="current-balance" id="modalBalance">$${balance.toFixed(2)}</div>

                    <div class="balance-input-group">
                        <input type="number" id="balanceAmount" placeholder="Enter amount" min="0" step="0.01" />
                        <button class="btn-add" onclick="addBalance('${user.id}')">
                            <i class="fas fa-plus"></i> Add
                        </button>
                        <button class="btn-remove" onclick="removeBalance('${user.id}')">
                            <i class="fas fa-minus"></i> Remove
                        </button>
                    </div>
                </div>
            `;

            modal.classList.add('show');
        }

        // ============================================================
        // QUICK ADD BALANCE
        // ============================================================
        function quickAddBalance(userId) {
            const amount = prompt('Enter amount to add (USD):');
            if (!amount) return;

            const num = parseFloat(amount);
            if (isNaN(num) || num <= 0) {
                showToast('❌ Please enter a valid amount.', 'error');
                return;
            }

            addBalanceAmount(userId, num);
        }

        // ============================================================
        // QUICK REMOVE BALANCE
        // ============================================================
        function quickRemoveBalance(userId) {
            const user = allUsers.find(u => u.id === userId);
            const currentBalance = user?.walletBalance || 0;

            const amount = prompt('Enter amount to remove (USD). Current balance: $' + currentBalance.toFixed(2));
            if (!amount) return;

            const num = parseFloat(amount);
            if (isNaN(num) || num <= 0) {
                showToast('❌ Please enter a valid amount.', 'error');
                return;
            }

            if (num > currentBalance) {
                showToast('❌ Cannot remove more than current balance ($' + currentBalance.toFixed(2) + ')', 'error');
                return;
            }

            removeBalanceAmount(userId, num);
        }

        // ============================================================
        // ADD BALANCE (from modal)
        // ============================================================
        function addBalance(userId) {
            const input = document.getElementById('balanceAmount');
            const amount = parseFloat(input.value);

            if (isNaN(amount) || amount <= 0) {
                showToast('❌ Please enter a valid amount.', 'error');
                return;
            }

            addBalanceAmount(userId, amount);
        }

        // ============================================================
        // REMOVE BALANCE (from modal)
        // ============================================================
        function removeBalance(userId) {
            const user = allUsers.find(u => u.id === userId);
            const currentBalance = user?.walletBalance || 0;

            const input = document.getElementById('balanceAmount');
            const amount = parseFloat(input.value);

            if (isNaN(amount) || amount <= 0) {
                showToast('❌ Please enter a valid amount.', 'error');
                return;
            }

            if (amount > currentBalance) {
                showToast('❌ Cannot remove more than current balance ($' + currentBalance.toFixed(2) + ')', 'error');
                return;
            }

            removeBalanceAmount(userId, amount);
        }

        // ============================================================
        // ADD BALANCE AMOUNT (core function)
        // ============================================================
        async function addBalanceAmount(userId, amount) {
            try {
                await db.collection('users').doc(userId).update({
                    walletBalance: firebase.firestore.FieldValue.increment(amount),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('✅ Added $' + amount.toFixed(2) + ' to user balance.', 'success');

                // Update local data
                const user = allUsers.find(u => u.id === userId);
                if (user) {
                    user.walletBalance = (user.walletBalance || 0) + amount;
                }

                // Update modal balance display
                const modalBalance = document.getElementById('modalBalance');
                if (modalBalance) {
                    const newBalance = (user?.walletBalance || 0);
                    modalBalance.textContent = '$' + newBalance.toFixed(2);
                }

                updateStats();
                renderTable();

                // Clear input
                const input = document.getElementById('balanceAmount');
                if (input) input.value = '';

            } catch (error) {
                console.error('Error adding balance:', error);
                showToast('❌ Failed to add balance: ' + error.message, 'error');
            }
        }

        // ============================================================
        // REMOVE BALANCE AMOUNT (core function)
        // ============================================================
        async function removeBalanceAmount(userId, amount) {
            try {
                await db.collection('users').doc(userId).update({
                    walletBalance: firebase.firestore.FieldValue.increment(-amount),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('✅ Removed $' + amount.toFixed(2) + ' from user balance.', 'success');

                // Update local data
                const user = allUsers.find(u => u.id === userId);
                if (user) {
                    user.walletBalance = (user.walletBalance || 0) - amount;
                }

                // Update modal balance display
                const modalBalance = document.getElementById('modalBalance');
                if (modalBalance) {
                    const newBalance = (user?.walletBalance || 0);
                    modalBalance.textContent = '$' + newBalance.toFixed(2);
                }

                updateStats();
                renderTable();

                // Clear input
                const input = document.getElementById('balanceAmount');
                if (input) input.value = '';

            } catch (error) {
                console.error('Error removing balance:', error);
                showToast('❌ Failed to remove balance: ' + error.message, 'error');
            }
        }

        // ============================================================
        // CLOSE MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // ============================================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================================
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // INIT
        // ============================================================
        if (checkAdminAuth()) {
            loadUsers();
            setInterval(loadUsers, 30000);
        }
    </script>

</body>
</html>
