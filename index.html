<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 40px 30px 34px;
            text-align: center;
        }
        .logo { margin-bottom: 24px; }
        .logo .icon { font-size: 2.8rem; display: inline-block; margin-bottom: 4px; }
        .logo h1 { font-size: 1.8rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .logo h1 span { color: #4dc9f6; }
        .logo .sub { font-size: 0.6rem; font-weight: 400; color: rgba(255,255,255,0.1); letter-spacing: 8px; text-transform: uppercase; margin-top: 2px; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0 20px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); }
        .divider span { font-size: 0.5rem; color: rgba(255,255,255,0.06); letter-spacing: 5px; text-transform: uppercase; font-weight: 300; }
        .field { position: relative; margin-bottom: 14px; }
        .field .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; opacity: 0.2; transition: 0.3s; }
        .field input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 3px;
        }
        .field input::placeholder { color: rgba(255,255,255,0.12); font-weight: 300; letter-spacing: 1px; }
        .field input:focus { border-color: rgba(77,201,246,0.2); background: rgba(77,201,246,0.02); }
        .field input:focus ~ .icon { opacity: 0.5; color: #4dc9f6; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4dc9f6, #2b8fc4);
            color: #080c18;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(77,201,246,0.25); }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid rgba(10,14,26,0.15);
            border-top: 3px solid #080c18;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        .spinner.hidden { display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 400;
            margin: 10px 0 2px;
            display: none;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .msg.show { display: block; animation: fade 0.3s ease; }
        .msg.error { background: rgba(255,50,50,0.06); border: 1px solid rgba(255,50,50,0.08); color: #ff6b6b; }
        .msg.success { background: rgba(0,255,150,0.04); border: 1px solid rgba(0,255,150,0.06); color: #00ff88; }
        @keyframes fade { 0% { opacity: 0; transform: translateY(-4px); } 100% { opacity: 1; transform: translateY(0); } }
        .footer { margin-top: 18px; font-size: 0.5rem; color: rgba(255,255,255,0.02); font-weight: 300; letter-spacing: 2px; }
        .key-gen-link { display: inline-block; margin-top: 12px; font-size: 0.6rem; color: rgba(255,255,255,0.06); text-decoration: none; transition: 0.3s; }
        .key-gen-link:hover { color: rgba(255,255,255,0.2); }
        @media (max-width: 480px) {
            .card { padding: 28px 20px 24px; border-radius: 20px; }
            .logo h1 { font-size: 1.6rem; }
            .logo .icon { font-size: 2.2rem; }
            .field input { padding: 13px 14px 13px 42px; font-size: 0.85rem; }
            .btn { font-size: 0.85rem; padding: 13px; min-height: 50px; }
            .spinner { width: 20px; height: 20px; border-width: 2.5px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="container">
        <div class="card">

            <div class="logo">
                <div class="icon">🛡️</div>
                <h1>Admin <span>Panel</span></h1>
                <div class="sub">ICE FISHING</div>
            </div>

            <div class="divider">
                <span>login</span>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="field">
                    <span class="icon">🔑</span>
                    <input
                        type="text"
                        id="adminKey"
                        placeholder="Enter admin key"
                        maxlength="30"
                        autofocus
                        required
                        autocomplete="off"
                    />
                </div>

                <div id="msg" class="msg">
                    <span id="msgText"></span>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    <span class="spinner hidden" id="spinner"></span>
                    <span id="btnLabel">Login</span>
                </button>
            </form>

            <a href="../admin-key-generator.html" class="key-gen-link">
                <i class="fas fa-key"></i> Generate Admin Key
            </a>

            <div class="footer">
                <span>❄️</span>
                <span>·</span>
                <span>secure access</span>
                <span>·</span>
                <span>🎰</span>
            </div>

        </div>
    </div>

    <!-- Firebase SDK (Make sure these are loaded) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE CONFIG - CORRECT URL
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8",
            databaseURL: "https://ice-fishing-c20bc-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log('🔥 Firebase initialized successfully!');
        } else {
            console.log('🔥 Firebase already initialized');
        }

        const db = firebase.database();

        // ============================================================
        // DOM
        // ============================================================
        const form = document.getElementById('loginForm');
        const keyInput = document.getElementById('adminKey');
        const msg = document.getElementById('msg');
        const msgText = document.getElementById('msgText');
        const loginBtn = document.getElementById('loginBtn');
        const btnLabel = document.getElementById('btnLabel');
        const spinner = document.getElementById('spinner');

        function showMsg(text, type) {
            msgText.textContent = text;
            msg.className = 'msg show ' + type;
        }

        function hideMsg() {
            msg.className = 'msg';
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            if (loading) {
                spinner.classList.remove('hidden');
                btnLabel.textContent = ' Verifying...';
            } else {
                spinner.classList.add('hidden');
                btnLabel.textContent = 'Login';
            }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault();
            hideMsg();

            const key = keyInput.value.trim().toUpperCase();
            if (!key) {
                showMsg('Please enter admin key.', 'error');
                keyInput.focus();
                return;
            }

            setLoading(true);

            try {
                // Log to see what's happening
                console.log('🔍 Searching for key:', key);

                const snapshot = await db.ref('ICE FISHING/adminKeys')
                    .orderByChild('key')
                    .equalTo(key)
                    .once('value');

                console.log('📊 Result exists?', snapshot.exists());

                if (!snapshot.exists()) {
                    showMsg('❌ Invalid admin key.', 'error');
                    setLoading(false);
                    keyInput.value = '';
                    keyInput.focus();
                    return;
                }

                let keyData = null;
                let keyId = null;
                snapshot.forEach((child) => {
                    keyData = child.val();
                    keyId = child.key;
                });

                console.log('✅ Key found:', keyData);

                if (!keyData.isActive) {
                    showMsg('❌ This key is inactive.', 'error');
                    setLoading(false);
                    return;
                }

                const loginCount = keyData.loginCount || 0;
                if (loginCount >= 10) {
                    showMsg('❌ Maximum login limit reached (10).', 'error');
                    setLoading(false);
                    return;
                }

                await db.ref('ICE FISHING/adminKeys/' + keyId).update({
                    loginCount: loginCount + 1,
                    lastLogin: new Date().toISOString()
                });

                sessionStorage.setItem('adminKey', key);
                sessionStorage.setItem('adminToken', btoa(key + ':' + Date.now()));

                showMsg('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Error:', error);
                showMsg('❌ Login failed: ' + error.message, 'error');
                setLoading(false);
            }
        }

        keyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
        });

        keyInput.addEventListener('focus', hideMsg);

        console.log('🔥 Admin Login Ready');
        console.log('📁 Database URL:', firebaseConfig.databaseURL);
    </script>

</body>
</html>
