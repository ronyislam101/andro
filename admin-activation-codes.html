<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activation Codes - ICE FISHING Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .placeholder {
            width: 80px;
        }

        /* Generate Section */
        .generate-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 24px 22px;
            margin-bottom: 20px;
        }

        .generate-section .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .generate-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .generate-row .full-width {
            grid-column: 1 / -1;
        }

        .generate-row input,
        .generate-row select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
        }

        .generate-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .generate-row input:focus,
        .generate-row select:focus {
            border-color: rgba(77, 201, 246, 0.15);
            background: rgba(77, 201, 246, 0.02);
        }

        .generate-row select option {
            background: #080c18;
            color: #ffffff;
        }

        .generate-row .code-info {
            display: flex;
            gap: 20px;
            padding: 8px 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .generate-row .code-info .label {
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        .generate-row .code-info .value {
            color: #ffd700;
            font-weight: 600;
        }

        .generate-row .code-info .value.duration {
            color: #00ff88;
        }

        .btn-generate {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #080c18;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            grid-column: 1 / -1;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.15);
        }

        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .code-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            background: rgba(255, 215, 0, 0.02);
            border: 1px solid rgba(255, 215, 0, 0.04);
            border-radius: 10px;
            padding: 12px 16px;
            display: none;
        }

        .code-display.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .code-display .code {
            flex: 1;
            font-family: monospace;
            font-size: 0.9rem;
            color: #ffd700;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .code-display .copy-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .code-display .copy-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .code-display .copy-btn.copied {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .info-text {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 8px;
        }

        .info-text i {
            margin-right: 4px;
        }

        /* Table */
        .table-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .table-section .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-section .title-row .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .table-section .title-row .count {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        td .code-text {
            font-family: monospace;
            color: #ffd700;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        td .user-name {
            color: #ffffff;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.active {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .status-badge.used {
            background: rgba(255, 165, 0, 0.06);
            color: #ffa500;
        }

        .status-badge.expired {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .action-btn.delete-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.delete-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .generate-row {
                grid-template-columns: 1fr;
            }
            .generate-row .full-width {
                grid-column: 1;
            }
            .generate-row input,
            .generate-row select {
                width: 100%;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .placeholder {
                display: none;
            }
            table {
                font-size: 0.65rem;
            }
            th, td {
                padding: 6px 6px;
            }
            .generate-row .code-info {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .generate-section { padding: 16px 14px; }
            .table-section { padding: 14px 12px; }
            .code-display { flex-wrap: wrap; }
            .code-display .code { font-size: 0.7rem; }
            td .code-text { font-size: 0.6rem; }
            .header h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>🎯 <span>Activation</span> Codes</h1>
            <div class="placeholder"></div>
        </div>

        <!-- Generate Section -->
        <div class="generate-section">
            <div class="title"><i class="fas fa-plus-circle"></i> Generate Activation Code</div>

            <div class="generate-row">
                <input type="text" id="userNameInput" placeholder="Enter user name (optional)" />

                <select id="durationSelect">
                    <option value="1" selected>1 Hour</option>
                    <option value="2">2 Hours</option>
                    <option value="4">4 Hours</option>
                    <option value="12">12 Hours</option>
                    <option value="24">24 Hours</option>
                    <option value="48">48 Hours</option>
                    <option value="72">72 Hours</option>
                </select>

                <div class="code-info full-width" id="codeInfo">
                    <div>
                        <span class="label">Duration</span>
                        <span class="value duration" id="durationDisplay">1 Hour</span>
                    </div>
                    <div>
                        <span class="label">Status</span>
                        <span class="value" style="color:#00ff88;">Active</span>
                    </div>
                </div>

                <button class="btn-generate" id="generateBtn" onclick="generateCode()">
                    <i class="fas fa-key"></i> Generate Code
                </button>
            </div>

            <div class="code-display" id="codeDisplay">
                <span class="code" id="generatedCode">XXXX-XXXX-XXXX</span>
                <button class="copy-btn" onclick="copyGeneratedCode()">📋 Copy</button>
            </div>

            <div class="info-text">
                <i class="fas fa-info-circle"></i> Activation codes are used for Signal access. One code = one time use.
            </div>
        </div>

        <!-- Table -->
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> All Activation Codes</span>
                <span class="count" id="codeCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Code</th>
                            <th>User</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Used By</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="codeTableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="fas fa-key"></i>
                                    No activation codes generated yet
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // CHECK ADMIN AUTH
        // ============================================================
        function checkAdminAuth() {
            const adminKey = sessionStorage.getItem('adminKey');
            const adminToken = sessionStorage.getItem('adminToken');

            if (!adminKey || !adminToken) {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // UPDATE DURATION DISPLAY
        // ============================================================
        document.getElementById('durationSelect').addEventListener('change', function() {
            const val = this.value;
            const hourText = val == 1 ? 'Hour' : 'Hours';
            document.getElementById('durationDisplay').textContent = val + ' ' + hourText;
        });

        // ============================================================
        // GENERATE ACTIVATION CODE
        // ============================================================
        async function generateCode() {
            const btn = document.getElementById('generateBtn');
            const userName = document.getElementById('userNameInput').value.trim();
            const duration = parseInt(document.getElementById('durationSelect').value);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

            try {
                const code = generateActivationCode();

                const expiryDate = new Date();
                expiryDate.setHours(expiryDate.getHours() + duration);

                await db.collection('activationCodes').add({
                    code: code,
                    userName: userName || 'Unassigned',
                    duration: duration,
                    expiryDate: expiryDate,
                    isUsed: false,
                    usedBy: '',
                    usedAt: null,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('generatedCode').textContent = code;
                document.getElementById('codeDisplay').classList.add('show');

                try { navigator.clipboard.writeText(code); } catch (e) {}

                showToast('✅ Activation code generated: ' + code, 'success');

                document.getElementById('userNameInput').value = '';
                loadCodes();

            } catch (error) {
                console.error('Error generating code:', error);
                showToast('❌ Failed to generate code: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Generate Code';
        }

        // ============================================================
        // GENERATE ACTIVATION CODE
        // ============================================================
        function generateActivationCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 12; i++) {
                if (i > 0 && i % 4 === 0) code += '-';
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // ============================================================
        // COPY GENERATED CODE
        // ============================================================
        function copyGeneratedCode() {
            const code = document.getElementById('generatedCode').textContent;
            const btn = document.querySelector('.code-display .copy-btn');

            if (code) {
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            }
        }

        // ============================================================
        // DELETE CODE
        // ============================================================
        async function deleteCode(docId) {
            if (!confirm('⚠️ Are you sure you want to delete this activation code?')) {
                return;
            }

            try {
                await db.collection('activationCodes').doc(docId).delete();
                showToast('🗑️ Activation code deleted', 'warning');
                loadCodes();
            } catch (error) {
                console.error('Error deleting code:', error);
                showToast('❌ Failed to delete code: ' + error.message, 'error');
            }
        }

        // ============================================================
        // LOAD CODES
        // ============================================================
        function loadCodes() {
            db.collection('activationCodes')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    const tbody = document.getElementById('codeTableBody');
                    document.getElementById('codeCount').textContent = 'Total: ' + snapshot.size;

                    if (snapshot.empty) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="7">
                                    <div class="empty-state">
                                        <i class="fas fa-key"></i>
                                        No activation codes generated yet
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    let html = '';
                    let index = 1;

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const isUsed = data.isUsed || false;
                        const status = data.status || 'active';

                        let statusBadge = 'active';
                        let statusText = 'Active';

                        if (isUsed) {
                            statusBadge = 'used';
                            statusText = 'Used';
                        } else if (status === 'expired') {
                            statusBadge = 'expired';
                            statusText = 'Expired';
                        }

                        const usedBy = data.usedBy || '—';

                        html += `
                            <tr>
                                <td>${index++}</td>
                                <td><span class="code-text">${data.code || 'N/A'}</span></td>
                                <td><span class="user-name">${data.userName || 'Unassigned'}</span></td>
                                <td>${data.duration || 0} Hours</td>
                                <td><span class="status-badge ${statusBadge}">${statusText}</span></td>
                                <td style="font-size:0.65rem; color:rgba(255,255,255,0.1);">${usedBy}</td>
                                <td>
                                    <button class="action-btn delete-btn" onclick="deleteCode('${doc.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = html;
                })
                .catch((error) => {
                    console.error('Error loading codes:', error);
                });
        }

        // ============================================================
        // INIT
        // ============================================================
        if (checkAdminAuth()) {
            loadCodes();
            setInterval(loadCodes, 30000);
        }
    </script>

</body>
</html>
