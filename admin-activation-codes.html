<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;

        }

        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .placeholder {
            width: 80px;
        }

        /* Generate Section */
        .generate-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 24px 22px;
            margin-bottom: 20px;
        }

        .generate-section .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;

        }

        .generate-row {

        .generate-row .full-width {

            font-size: 0.85rem;

            outline: none;
            transition: 0.3s;
        }

        .generate-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .generate-row input:focus,
        .generate-row select:focus {
            border-color: rgba(77, 201, 246, 0.15);
            background: rgba(77, 201, 246, 0.02);
        }

        .generate-row select option {
            background: #080c18;
            color: #ffffff;

        .generate-row .code-info {

            border-radius: 10px;

            color: #080c18;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            grid-column: 1 / -1;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.15);
        }

        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .code-display {

            gap: 12px;

            font-size: 0.5rem;

        .action-btn.delete-btn:hover {

        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .generate-row {
                grid-template-columns: 1fr;
            }
            .generate-row .full-width {
                grid-column: 1;
            }
            .generate-row input,
            .generate-row select {
                width: 100%;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .placeholder {
                display: none;
            }
            table {
                font-size: 0.65rem;
            }
            th, td {
                padding: 6px 6px;
            }
            .generate-row .code-info {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .generate-section { padding: 16px 14px; }
            .table-section { padding: 14px 12px; }
            .code-display { flex-wrap: wrap; }
            .code-display .code { font-size: 0.7rem; }
            td .code-text { font-size: 0.6rem; }
            .header h1 { font-size: 1rem; }
        }

    <script>
(function () {
    const storageKey = 'iceFishingAdminSession';
    function read(storage, key) {
        try { return storage.getItem(key); } catch (_) { return null; }
    }
    function remove(storage, key) {
        try { storage.removeItem(key); } catch (_) {}
    }
    function valid(record) {
        return record && typeof record.key === 'string' && record.key.trim() &&
            typeof record.token === 'string' && record.token.trim();
    }
    function parse(raw) {
        try { const record = JSON.parse(raw); return valid(record) ? record : null; }
        catch (_) { return null; }
    }
    function cleanLegacy() {
        for (const storage of [localStorage, sessionStorage]) {
            remove(storage, 'adminKey');
            remove(storage, 'adminToken');
        }
    }
    function save(key, token) {
        const record = { key, token };
        if (!valid(record)) throw new Error('Invalid admin session. Please login again.');
        localStorage.setItem(storageKey, JSON.stringify(record));
        cleanLegacy();
    }
    function get() { return parse(read(localStorage, storageKey)); }
    function clear() {
        for (const storage of [localStorage, sessionStorage]) {
            remove(storage, storageKey);
            remove(storage, 'adminKey');
            remove(storage, 'adminToken');
        }
    }
    // Preserve already signed-in sessions when these updated pages are installed.
    if (!get()) {
        const savedLocal = {
            key: read(localStorage, 'adminKey'),
            token: read(localStorage, 'adminToken')
        };
        const savedTab = {
            key: read(sessionStorage, 'adminKey'),
            token: read(sessionStorage, 'adminToken')
        };
        const legacy = valid(savedLocal) ? savedLocal : valid(savedTab) ? savedTab : null;
        if (legacy) {
            try { save(legacy.key, legacy.token); } catch (_) {}
        }
    } else {
        cleanLegacy();
    }
    window.AdminSession = {
        get,
        save,
        clear,
        getKey: () => { const session = get(); return session ? session.key : null; },
        getToken: () => { const session = get(); return session ? session.token : null; }
    };
})();

window.addEventListener('storage', function (event) {
    if ((event.key === 'iceFishingAdminSession' || event.key === null) && !AdminSession.get()) {
        window.location.replace('index.html');
    }
});
</script>

        const firebaseConfig = {

        firebase.initializeApp(firebaseConfig);

        // ============================================================
        // CHECK ADMIN AUTH
        // ============================================================
        function checkAdminAuth() {
            const adminKey = AdminSession.getKey();
            const adminToken = AdminSession.getToken();

            if (!adminKey || !adminToken) {
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // UPDATE DURATION DISPLAY
        // ============================================================
        document.getElementById('durationSelect').addEventListener('change', function() {
            const val = this.value;
            const hourText = val == 1 ? 'Hour' : 'Hours';
            document.getElementById('durationDisplay').textContent = val + ' ' + hourText;
        });

        // ============================================================
        // GENERATE ACTIVATION CODE
        // ============================================================
        async function generateCode() {
            const btn = document.getElementById('generateBtn');
            const userName = document.getElementById('userNameInput').value.trim();
            const duration = parseInt(document.getElementById('durationSelect').value);

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

            try {
                const code = generateActivationCode();

                const expiryDate = new Date();
                expiryDate.setHours(expiryDate.getHours() + duration);

                await db.collection('activationCodes').add({
                    code: code,
                    userName: userName || 'Unassigned',
                    duration: duration,
                    expiryDate: expiryDate,
                    isUsed: false,
                    usedBy: '',
                    usedAt: null,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('generatedCode').textContent = code;
                document.getElementById('codeDisplay').classList.add('show');

                try { navigator.clipboard.writeText(code); } catch (e) {}

                showToast('✅ Activation code generated: ' + code, 'success');

                document.getElementById('userNameInput').value = '';
                loadCodes();

            } catch (error) {
                console.error('Error generating code:', error);
                showToast('❌ Failed to generate code: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Generate Code';
        }

        // ============================================================
        // GENERATE ACTIVATION CODE
        // ============================================================
        function generateActivationCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 12; i++) {
                if (i > 0 && i % 4 === 0) code += '-';
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // ============================================================
        // COPY GENERATED CODE
        // ============================================================
        function copyGeneratedCode() {
            const code = document.getElementById('generatedCode').textContent;
            const btn = document.querySelector('.code-display .copy-btn');

            if (code) {
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            }
        }

        // ============================================================
        // DELETE CODE
        // ============================================================
        function loadCodes() {
            db.collection('activationCodes')
                .get()
                .then((snapshot) => {
                    const tbody = document.getElementById('codeTableBody');
                    document.getElementById('codeCount').textContent = 'Total: ' + snapshot.size;

                    if (snapshot.empty) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="7">
                                    <div class="empty-state">
                                        <i class="fas fa-key"></i>
                                        No activation codes generated yet
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    let html = '';
                    let index = 1;

                    [...snapshot.docs].sort((a,b) => recordTime(b.data().createdAt) - recordTime(a.data().createdAt)).forEach((doc) => {
                        const data = doc.data();
                        const isUsed = data.isUsed || false;
                        const status = data.status || 'active';

                        let statusBadge = 'active';
                        let statusText = 'Active';

                        if (data.isBanned || status === 'banned') {
                            statusBadge = 'banned';
                            statusText = 'Banned';
                        } else if (isUsed) {
                            statusBadge = 'used';
                            statusText = 'Used';
                        } else if (status === 'expired') {
                            statusBadge = 'expired';
                            statusText = 'Expired';
                        }

                        const usedBy = data.usedBy || '—';

                        html += `
                            <tr>
                                <td>${index++}</td>
                                <td><span class="code-text">${data.code || 'N/A'}</span></td>
                                <td><span class="user-name">${data.userName || 'Unassigned'}</span></td>
                                <td>${data.duration || 0} Hours</td>
                                <td><span class="status-badge ${statusBadge}">${statusText}</span></td>
                                <td style="font-size:0.65rem; color:rgba(255,255,255,0.1);">${usedBy}</td>
                                <td>
                                    ${data.isBanned || status === 'banned' ? `<button data-manage title="Unban code" class="action-btn unban-btn" onclick="banCode('${doc.id}',false)"><i class="fas fa-unlock"></i></button>` : `<button data-manage title="Ban code" class="action-btn ban-btn" onclick="banCode('${doc.id}',true)"><i class="fas fa-ban"></i></button>`}
                                    <button data-manage title="Delete code" class="action-btn delete-btn" onclick="deleteCode('${doc.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = html;
                })
                .catch((error) => {
                    console.error('Error loading codes:', error);
                });
        }

        // ============================================================
        // INIT
        // ============================================================
        if (checkAdminAuth()) {
            loadCodes();
            setInterval(loadCodes, 30000);
        }
    
let managementBusy = false;
function recordTime(value) {
    if (!value) return 0;
    if (typeof value.toMillis === 'function') return value.toMillis();
    const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
    return Number.isFinite(date.getTime()) ? date.getTime() : 0;
}
async function manageRecords(task) {
    if (!AdminSession.get()) { window.location.replace('index.html'); return; }
    if (managementBusy) return;
    managementBusy = true;
    document.querySelectorAll('[data-manage]').forEach(button => { button.disabled = true; });
    try { await task(); }
    catch (error) { showToast('Failed: ' + error.message, 'error'); }
    finally {
        managementBusy = false;
        document.querySelectorAll('[data-manage]').forEach(button => { button.disabled = false; });
    }
}
async function deleteOneRecord(collectionName, id, label, reload) {
    return manageRecords(async () => {
        if (!confirm('Delete this ' + label + '? This cannot be undone. Deleting a request does not reverse an approved balance or package.')) return;
        await db.collection(collectionName).doc(id).delete();
        if (typeof closeModal === 'function') closeModal();
        showToast(label + ' deleted', 'warning');
        reload();
    });
}
async function deleteAllRecords(collectionName, label, reload) {
    return manageRecords(async () => {
        const snapshot = await db.collection(collectionName).get();
        if (snapshot.empty) { showToast('No ' + label + ' to delete', 'warning'); return; }
        if (!confirm('Permanently delete ALL ' + snapshot.size + ' ' + label + ', including approved records? This deletes records only; approved balances and packages are not reversed.')) return;
        let done = 0;
        try {
            for (let offset = 0; offset < snapshot.docs.length; offset += 450) {
                const docs = snapshot.docs.slice(offset, offset + 450);
                const batch = db.batch();
                docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                done += docs.length;
            }
        } catch (error) {
            reload();
            throw new Error('Deleted ' + done + ' of ' + snapshot.size + '. ' + error.message);
        }
        if (typeof closeModal === 'function') closeModal();
        showToast('Deleted ' + done + ' ' + label, 'warning');
        reload();
    });
}

function activationBanPatch(data, banned) {
    if (banned) return {
        isBanned: true,
        status: 'banned',
        statusBeforeBan: data.isBanned ? (data.statusBeforeBan || 'active') : (data.status || 'active'),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    const expired = data.expiryDate && recordTime(data.expiryDate) < Date.now();
    return {
        isBanned: false,
        status: expired ? 'expired' : data.isUsed ? 'used' : (data.statusBeforeBan || (data.status !== 'banned' && data.status) || 'active'),
        statusBeforeBan: firebase.firestore.FieldValue.delete(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
}
async function banCode(id, banned) {
    return manageRecords(async () => {
        if (!confirm((banned ? 'Ban' : 'Unban') + ' this activation code?')) return;
        const ref = db.collection('activationCodes').doc(id);
        await db.runTransaction(async transaction => {
            const doc = await transaction.get(ref);
            if (!doc.exists) throw new Error('Activation code no longer exists.');
            transaction.update(ref, activationBanPatch(doc.data(), banned));
        });
        showToast('Activation code ' + (banned ? 'banned' : 'unbanned'), 'success');
        loadCodes();
    });
}
async function banAllCodes(banned) {
    return manageRecords(async () => {
        const snapshot = await db.collection('activationCodes').get();
        if (snapshot.empty) { showToast('No activation codes found', 'warning'); return; }
        if (!confirm((banned ? 'Ban' : 'Unban') + ' ALL ' + snapshot.size + ' activation codes? Used codes remain used and expiry is unchanged.')) return;
        let done = 0;
        try {
            for (let offset = 0; offset < snapshot.docs.length; offset += 450) {
                const docs = snapshot.docs.slice(offset, offset + 450);
                const batch = db.batch();
                docs.forEach(doc => batch.update(doc.ref, activationBanPatch(doc.data(), banned)));
                await batch.commit();
                done += docs.length;
            }
        } catch (error) {
            loadCodes();
            throw new Error('Updated ' + done + ' of ' + snapshot.size + ' codes. ' + error.message);
        }
        showToast(done + ' activation codes ' + (banned ? 'banned' : 'unbanned'), 'success');
        loadCodes();
    });
}
function deleteCode(id) { return deleteOneRecord('activationCodes', id, 'activation code', loadCodes); }
function deleteAllCodes() { return deleteAllRecords('activationCodes', 'activation codes', loadCodes); }

</script>
