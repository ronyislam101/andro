<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>License Keys - ICE FISHING Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            flex-wrap: nowrap;
            gap: 10px;
        }

        .header .back-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            white-space: nowrap;
            min-width: 0;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .logout-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            border: 1px solid rgba(255, 50, 50, 0.06);
            border-radius: 10px;
            background: rgba(255, 50, 50, 0.02);
            color: rgba(255, 50, 50, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .logout-btn:hover {
            background: rgba(255, 50, 50, 0.08);
            color: #ff6b6b;
        }

        .generate-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 24px 22px;
            margin-bottom: 20px;
        }

        .generate-section .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .generate-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .generate-row .full-width {
            grid-column: 1 / -1;
        }

        .generate-row input,
        .generate-row select {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
        }

        .generate-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        .generate-row input:focus,
        .generate-row select:focus {
            border-color: rgba(77, 201, 246, 0.15);
            background: rgba(77, 201, 246, 0.02);
        }

        .generate-row select option {
            background: #080c18;
            color: #ffffff;
        }

        .generate-row .package-info {
            display: flex;
            gap: 20px;
            padding: 8px 0;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .generate-row .package-info .label {
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        .generate-row .package-info .value {
            color: #ffd700;
            font-weight: 600;
        }

        .generate-row .package-info .value.usdt {
            color: #4dc9f6;
        }

        .generate-row .package-info .value.duration {
            color: #00ff88;
        }

        .btn-generate {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4dc9f6, #2b8fc4);
            color: #080c18;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            grid-column: 1 / -1;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(77, 201, 246, 0.15);
        }

        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .key-display {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            background: rgba(255, 215, 0, 0.02);
            border: 1px solid rgba(255, 215, 0, 0.04);
            border-radius: 10px;
            padding: 12px 16px;
            display: none;
        }

        .key-display.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .key-display .key {
            flex: 1;
            font-family: monospace;
            font-size: 0.9rem;
            color: #ffd700;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .key-display .copy-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .key-display .copy-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .key-display .copy-btn.copied {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .info-text {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 8px;
        }

        .info-text i {
            margin-right: 4px;
        }

        .table-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .table-section .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-section .title-row .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .table-section .title-row .count {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        td .key-text {
            font-family: monospace;
            color: #ffd700;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        td .user-name {
            color: #ffffff;
            font-weight: 500;
        }

        td .package-name {
            color: #4dc9f6;
            font-weight: 500;
        }

        td .package-amount {
            color: #ffd700;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.active {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .status-badge.used {
            background: rgba(255, 165, 0, 0.06);
            color: #ffa500;
        }

        .status-badge.banned {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .action-btn.reset-btn {
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
        }

        .action-btn.reset-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .action-btn.ban-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.ban-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .action-btn.unban-btn {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .action-btn.unban-btn:hover {
            background: rgba(0, 255, 136, 0.12);
        }

        .action-btn.delete-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.delete-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        @media (max-width: 600px) {
            .header {
                flex-wrap: nowrap;
                padding: 12px 14px;
                gap: 6px;
            }
            .header .back-btn {
                padding: 6px 10px;
                font-size: 0.6rem;
                flex-shrink: 0;
            }
            .header .back-btn i {
                font-size: 0.7rem;
            }
            .header h1 {
                font-size: 0.85rem;
                white-space: nowrap;
                flex: 1;
                text-align: center;
            }
            .header .logout-btn {
                padding: 6px 10px;
                font-size: 0.6rem;
                flex-shrink: 0;
            }
            .header .logout-btn i {
                font-size: 0.7rem;
            }
            .generate-row {
                grid-template-columns: 1fr;
            }
            .generate-row .full-width {
                grid-column: 1;
            }
            .generate-row input,
            .generate-row select {
                width: 100%;
            }
            table {
                font-size: 0.6rem;
            }
            th, td {
                padding: 4px 4px;
            }
            .generate-row .package-info {
                flex-wrap: wrap;
                gap: 6px;
                font-size: 0.7rem;
            }
            .generate-section {
                padding: 16px 14px;
            }
            .table-section {
                padding: 14px 12px;
            }
            .key-display {
                flex-wrap: wrap;
            }
            .key-display .key {
                font-size: 0.7rem;
            }
            td .key-text {
                font-size: 0.55rem;
            }
            .action-btn {
                padding: 2px 6px;
                font-size: 0.45rem;
            }
            .status-badge {
                padding: 1px 6px;
                font-size: 0.45rem;
            }
            #toast {
                max-width: 280px;
                font-size: 0.7rem;
                padding: 10px 14px;
                top: 10px;
                right: 10px;
            }
        }

        @media (max-width: 400px) {
            .header .back-btn {
                padding: 4px 8px;
                font-size: 0.5rem;
            }
            .header .back-btn i {
                font-size: 0.6rem;
            }
            .header h1 {
                font-size: 0.7rem;
            }
            .header .logout-btn {
                padding: 4px 8px;
                font-size: 0.5rem;
            }
            .header .logout-btn i {
                font-size: 0.6rem;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <h1>🔑 <span>License</span> Keys</h1>
            <button class="logout-btn" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Generate Section -->
        <div class="generate-section">
            <div class="title"><i class="fas fa-plus-circle"></i> Generate New License Key</div>

            <div class="generate-row">
                <input type="text" id="userNameInput" placeholder="Enter user name" />

                <select id="packageSelect" class="full-width">
                    <option value="starter">⏰ Starter - 1 Hour ($37.35)</option>
                    <option value="pro">🎯 Pro - 2 Hours ($66.27)</option>
                    <option value="ultimate">🔥 Ultimate - 4 Hours ($126.51)</option>
                    <option value="daypass">☀️ Day Pass - 12 Hours ($307.23)</option>
                    <option value="access">🌙 Access - 24 Hours ($487.95)</option>
                </select>

                <div class="package-info full-width" id="packageInfo">
                    <div>
                        <span class="label">Package</span>
                        <span class="value" id="pkgNameDisplay">⏰ Starter</span>
                    </div>
                    <div>
                        <span class="label">Price</span>
                        <span class="value usdt" id="pkgPriceDisplay">$37.35</span>
                    </div>
                    <div>
                        <span class="label">Duration</span>
                        <span class="value duration" id="pkgDurationDisplay">1 Hour</span>
                    </div>
                </div>

                <button class="btn-generate" id="generateBtn" onclick="generateLicenseKey()">
                    <i class="fas fa-key"></i> Generate Key
                </button>
            </div>

            <div class="key-display" id="keyDisplay">
                <span class="key" id="generatedKey">XXXX-XXXX-XXXX-XXXX</span>
                <button class="copy-btn" onclick="copyGeneratedKey()">📋 Copy</button>
            </div>

            <div class="info-text">
                <i class="fas fa-info-circle"></i> Each key allows 1 device with max 3 logins.
            </div>
        </div>

        <!-- Table -->
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> All License Keys</span>
                <span class="count" id="keyCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>License Key</th>
                            <th>User</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Logins</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keyTableBody">
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <i class="fas fa-key"></i>
                                    No license keys generated yet
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8",
            databaseURL: "https://ice-fishing-c20bc-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const functions = firebase.functions();
        const db = firebase.database();

        const packageData = {
            starter: { name: 'Starter', price: 37.35, duration: '1 Hour', emoji: '⏰' },
            pro: { name: 'Pro', price: 66.27, duration: '2 Hours', emoji: '🎯' },
            ultimate: { name: 'Ultimate', price: 126.51, duration: '4 Hours', emoji: '🔥' },
            daypass: { name: 'Day Pass', price: 307.23, duration: '12 Hours', emoji: '☀️' },
            access: { name: 'Access', price: 487.95, duration: '24 Hours', emoji: '🌙' }
        };

        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // CHECK ADMIN AUTH - SessionStorage Based
        // ============================================================
        function checkAdminAuth() {
            const adminKey = sessionStorage.getItem('adminKey');
            const adminToken = sessionStorage.getItem('adminToken');
            
            console.log('🔑 Admin Key:', adminKey);
            console.log('🔑 Admin Token:', adminToken);
            
            if (!adminKey || !adminToken) {
                console.log('⚠️ Admin not logged in - redirecting to index.html');
                showToast('⚠️ Please login as admin first', 'warning');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return false;
            }
            return true;
        }

        // ============================================================
        // GENERATE LICENSE KEY
        // ============================================================
        async function generateLicenseKey() {
            const btn = document.getElementById('generateBtn');
            const userName = document.getElementById('userNameInput').value.trim() || 'Unassigned';
            const packageId = document.getElementById('packageSelect').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

            try {
                const adminKey = sessionStorage.getItem('adminKey');
                if (!adminKey) {
                    showToast('❌ Please login as admin first', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-key"></i> Generate Key';
                    return;
                }

                const callable = functions.httpsCallable('generateLicenseKey');
                const result = await callable({
                    userName: userName,
                    packageId: packageId,
                    adminKey: adminKey
                });

                const data = result.data;
                console.log('✅ Key generated:', data);

                document.getElementById('generatedKey').textContent = data.key;
                document.getElementById('keyDisplay').classList.add('show');

                try {
                    await navigator.clipboard.writeText(data.key);
                    showToast('✅ Key generated & copied: ' + data.key, 'success');
                } catch (e) {
                    showToast('✅ Key generated: ' + data.key, 'success');
                }

                document.getElementById('userNameInput').value = '';
                loadKeys();

            } catch (error) {
                console.error('❌ Error:', error);
                showToast('❌ Failed: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Generate Key';
        }

        function copyGeneratedKey() {
            const key = document.getElementById('generatedKey').textContent;
            const btn = document.querySelector('.key-display .copy-btn');

            if (key && key !== 'XXXX-XXXX-XXXX-XXXX') {
                navigator.clipboard.writeText(key).then(() => {
                    btn.textContent = '✅ Copied!';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Copy';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            }
        }

        // ============================================================
        // LOAD KEYS
        // ============================================================
        function loadKeys() {
            const keysRef = db.ref('userKeys');
            keysRef.once('value')
                .then((snapshot) => {
                    const tbody = document.getElementById('keyTableBody');
                    const data = snapshot.val();

                    if (!data) {
                        document.getElementById('keyCount').textContent = 'Total: 0';
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="8">
                                    <div class="empty-state">
                                        <i class="fas fa-key"></i>
                                        No license keys generated yet
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    const keys = Object.values(data);
                    document.getElementById('keyCount').textContent = 'Total: ' + keys.length;

                    let html = '';
                    let index = 1;

                    keys.forEach((keyData) => {
                        const isBanned = keyData.isBanned || false;
                        const loginCount = keyData.loginCount || 0;
                        const maxLogins = keyData.maxLogins || 3;

                        let statusBadge = 'active';
                        let statusText = 'Active';

                        if (isBanned) {
                            statusBadge = 'banned';
                            statusText = '🚫 Banned';
                        } else if (loginCount >= maxLogins) {
                            statusBadge = 'used';
                            statusText = 'Used (' + loginCount + '/' + maxLogins + ')';
                        } else {
                            statusText = 'Active (' + loginCount + '/' + maxLogins + ')';
                        }

                        html += `
                            <tr>
                                <td>${index++}</td>
                                <td><span class="key-text">${keyData.key || 'N/A'}</span></td>
                                <td><span class="user-name">${keyData.userName || 'Unassigned'}</span></td>
                                <td><span class="package-name">${keyData.packageName || '—'}</span></td>
                                <td><span class="package-amount">$${keyData.packagePrice || 0}</span></td>
                                <td>${loginCount}/${maxLogins}</td>
                                <td><span class="status-badge ${statusBadge}">${statusText}</span></td>
                                <td>
                                    <button class="action-btn reset-btn" onclick="resetKey('${keyData.key}')">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                    ${isBanned ? 
                                        `<button class="action-btn unban-btn" onclick="banKey('${keyData.key}', false)">
                                            <i class="fas fa-unlock"></i>
                                        </button>` :
                                        `<button class="action-btn ban-btn" onclick="banKey('${keyData.key}', true)">
                                            <i class="fas fa-ban"></i>
                                        </button>`
                                    }
                                    <button class="action-btn delete-btn" onclick="deleteKey('${keyData.key}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = html;
                })
                .catch((error) => {
                    console.error('Error loading keys:', error);
                });
        }

        // ============================================================
        // RESET KEY
        // ============================================================
        async function resetKey(key) {
            if (!confirm('Reset this license key?')) return;

            try {
                const cleanKey = key.replace(/-/g, '');
                await db.ref('userKeys/' + cleanKey).update({
                    isUsed: false,
                    usedBy: '',
                    loginCount: 0,
                    deviceId: '',
                    status: 'active',
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });

                showToast('✅ Key reset successfully!', 'success');
                loadKeys();
            } catch (error) {
                showToast('❌ Failed: ' + error.message, 'error');
            }
        }

        // ============================================================
        // BAN / UNBAN KEY
        // ============================================================
        async function banKey(key, isBanned) {
            const action = isBanned ? 'ban' : 'unban';
            if (!confirm(`⚠️ ${action} this key?`)) return;

            try {
                const cleanKey = key.replace(/-/g, '');
                await db.ref('userKeys/' + cleanKey).update({
                    isBanned: isBanned,
                    status: isBanned ? 'banned' : 'active',
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });

                showToast(`✅ Key ${action}ned!`, 'success');
                loadKeys();
            } catch (error) {
                showToast('❌ Failed: ' + error.message, 'error');
            }
        }

        // ============================================================
        // DELETE KEY
        // ============================================================
        async function deleteKey(key) {
            if (!confirm('⚠️ Delete this key?')) return;

            try {
                const cleanKey = key.replace(/-/g, '');
                await db.ref('userKeys/' + cleanKey).remove();
                showToast('🗑️ Key deleted', 'warning');
                loadKeys();
            } catch (error) {
                showToast('❌ Failed: ' + error.message, 'error');
            }
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('adminKey');
                sessionStorage.removeItem('adminToken');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        // INIT - Check Auth on Page Load
        // ============================================================
        if (checkAdminAuth()) {
            console.log('✅ Admin logged in - loading keys');
            loadKeys();
            setInterval(loadKeys, 30000);
        }
    </script>

</body>
</html>
