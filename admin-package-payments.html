<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Payments - ICE FISHING Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            text-align: center;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .placeholder {
            width: 80px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-card .number.blue { color: #4dc9f6; }
        .stat-card .number.green { color: #00ff88; }
        .stat-card .number.orange { color: #ffa500; }
        .stat-card .number.red { color: #ff6b6b; }

        .stat-card .label {
            font-size: 0.55rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Filter */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-row select,
        .filter-row input {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: 0.3s;
        }

        .filter-row select option {
            background: #080c18;
            color: #ffffff;
        }

        .filter-row select:focus,
        .filter-row input:focus {
            border-color: rgba(77, 201, 246, 0.15);
        }

        .filter-row input {
            flex: 1;
            min-width: 200px;
        }

        .filter-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        /* Table */
        .table-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .table-section .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-section .title-row .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .table-section .title-row .count {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        td .user-name {
            color: #ffffff;
            font-weight: 500;
        }

        td .amount {
            color: #ffd700;
            font-weight: 600;
        }

        td .package-name {
            color: #4dc9f6;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.pending {
            background: rgba(255, 165, 0, 0.06);
            color: #ffa500;
        }

        .status-badge.approved {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .status-badge.rejected {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .action-btn.approve-btn {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .action-btn.approve-btn:hover {
            background: rgba(0, 255, 136, 0.12);
        }

        .action-btn.reject-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.reject-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .action-btn.view-btn {
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
        }

        .action-btn.view-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #0e1525;
            border: 1px solid #1a2540;
            border-radius: 20px;
            padding: 30px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal .modal-header h2 {
            font-size: 1.1rem;
        }

        .modal .modal-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .modal-header .close-btn:hover {
            color: #ffffff;
        }

        .modal .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            align-items: center;
        }

        .modal .detail-row .label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
        }

        .modal .detail-row .value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .modal .detail-row .value.gold {
            color: #ffd700;
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .modal-actions .btn-approve {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #080c18;
        }

        .modal .modal-actions .btn-approve:hover {
            transform: translateY(-2px);
        }

        .modal .modal-actions .btn-reject {
            background: linear-gradient(135deg, #ff6b6b, #cc4444);
            color: #ffffff;
        }

        .modal .modal-actions .btn-reject:hover {
            transform: translateY(-2px);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .placeholder {
                display: none;
            }
            table {
                font-size: 0.65rem;
            }
            th, td {
                padding: 6px 6px;
            }
            .filter-row {
                flex-direction: column;
            }
            .filter-row input {
                min-width: unset;
            }
            .modal {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card .number {
                font-size: 1.2rem;
            }
            .header h1 {
                font-size: 1rem;
            }
            .table-section {
                padding: 14px 12px;
            }
            .modal {
                padding: 16px;
            }
            .modal .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .modal .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>📦 <span>Package</span> Payments</h1>
            <div class="placeholder"></div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="number blue" id="totalPackages">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-card">
                <div class="number orange" id="pendingPackages">0</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="approvedPackages">0</div>
                <div class="label">Approved</div>
            </div>
            <div class="stat-card">
                <div class="number red" id="rejectedPackages">0</div>
                <div class="label">Rejected</div>
            </div>
        </div>

        <!-- Filter -->
        <div class="filter-row">
            <select id="statusFilter" onchange="applyFilters()">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Search by user or package..." oninput="applyFilters()" />
        </div>

        <!-- Table -->
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> Package Payment Requests</span>
                <span class="count" id="packageCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="packageTableBody">
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <i class="fas fa-box"></i>
                                    No package payment requests found
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Package Details</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allPackages = [];

        // ============================================================
        // CHECK ADMIN AUTH
        // ============================================================
        function checkAdminAuth() {
            const adminKey = sessionStorage.getItem('adminKey');
            const adminToken = sessionStorage.getItem('adminToken');

            if (!adminKey || !adminToken) {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // LOAD PACKAGE PAYMENT REQUESTS
        // IMPORTANT: package checkout creates documents in `paymentRequests`.
        // `userPackages` is created only after admin approval.
        // ============================================================
        async function loadPackagePayments() {
            try {
                // Do NOT use orderBy() here. Requests may have legacy/missing
                // createdAt values and orderBy can also require an index.
                const snapshot = await db.collection('paymentRequests').get();
                allPackages = [];

                snapshot.forEach((doc) => {
                    const data = doc.data() || {};
                    allPackages.push({ id: doc.id, ...data });
                });

                allPackages.sort((a, b) => toMillis(b.createdAt) - toMillis(a.createdAt));
                updateStats();
                applyFilters();
            } catch (error) {
                console.error('Error loading package payment requests:', error);
                allPackages = [];
                updateStats();
                renderTable([]);
                showToast('❌ Failed to load package requests: ' + error.message, 'error');
            }
        }

        function toMillis(value) {
            if (!value) return 0;
            if (typeof value.toMillis === 'function') return value.toMillis();
            if (typeof value.toDate === 'function') return value.toDate().getTime();
            if (value.seconds != null) return Number(value.seconds) * 1000;
            const n = new Date(value).getTime();
            return Number.isFinite(n) ? n : 0;
        }

        function formatDate(value) {
            const ms = toMillis(value);
            if (!ms) return '—';
            return new Date(ms).toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function esc(value) {
            return String(value ?? '—')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ============================================================
        // UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allPackages.length;
            const pending = allPackages.filter(p => String(p.status || 'pending').toLowerCase() === 'pending').length;
            const approved = allPackages.filter(p => String(p.status || '').toLowerCase() === 'approved').length;
            const rejected = allPackages.filter(p => String(p.status || '').toLowerCase() === 'rejected').length;

            document.getElementById('totalPackages').textContent = total;
            document.getElementById('pendingPackages').textContent = pending;
            document.getElementById('approvedPackages').textContent = approved;
            document.getElementById('rejectedPackages').textContent = rejected;
            document.getElementById('packageCount').textContent = 'Total: ' + total;
        }

        // ============================================================
        // APPLY FILTERS
        // ============================================================
        function applyFilters() {
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.trim().toLowerCase();

            let filtered = allPackages.slice();

            if (statusFilter !== 'all') {
                filtered = filtered.filter(p => String(p.status || 'pending').toLowerCase() === statusFilter);
            }

            if (search) {
                filtered = filtered.filter(p =>
                    String(p.userName || '').toLowerCase().includes(search) ||
                    String(p.userEmail || '').toLowerCase().includes(search) ||
                    String(p.packageName || '').toLowerCase().includes(search) ||
                    String(p.packageId || '').toLowerCase().includes(search) ||
                    String(p.transactionId || '').toLowerCase().includes(search) ||
                    String(p.paymentMethod || '').toLowerCase().includes(search)
                );
            }

            renderTable(filtered);
        }

        // ============================================================
        // RENDER TABLE
        // ============================================================
        function renderTable(packages) {
            const tbody = document.getElementById('packageTableBody');

            if (!packages.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fas fa-box"></i>
                                No package payment requests found
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            let index = 1;

            packages.forEach((p) => {
                const rawStatus = String(p.status || 'pending').toLowerCase();
                const statusClass = ['pending', 'approved', 'rejected'].includes(rawStatus) ? rawStatus : 'pending';
                const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                const amount = Number(p.amount ?? p.packagePrice ?? 0);
                const method = p.paymentMethod || p.method || '—';
                const region = p.paymentRegion || p.region || '—';

                html += `
                    <tr>
                        <td>${index++}</td>
                        <td>
                            <span class="user-name">${esc(p.userName || 'Unknown')}</span>
                            <br><span style="font-size:.55rem;color:rgba(255,255,255,.12);">${esc(p.userEmail || '')}</span>
                        </td>
                        <td><span class="package-name">${esc(p.packageName || p.packageId || '—')}</span></td>
                        <td><span class="amount">${amount > 0 ? '$' + amount.toFixed(2) : '—'}</span></td>
                        <td>${esc(method)}<br><span style="font-size:.55rem;color:rgba(255,255,255,.12);">${esc(region)}</span></td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        <td style="font-size:.6rem;color:rgba(255,255,255,.35);">${esc(formatDate(p.createdAt))}</td>
                        <td>
                            <button class="action-btn view-btn" onclick="viewPackage('${p.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${rawStatus === 'pending' ? `
                                <button class="action-btn approve-btn" onclick="approvePackage('${p.id}')">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="action-btn reject-btn" onclick="rejectPackage('${p.id}')">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // VIEW PACKAGE PAYMENT REQUEST
        // ============================================================
        function viewPackage(docId) {
            const pkg = allPackages.find(p => p.id === docId);
            if (!pkg) return;

            const modal = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');
            const rawStatus = String(pkg.status || 'pending').toLowerCase();
            const amount = Number(pkg.amount ?? pkg.packagePrice ?? 0);

            body.innerHTML = `
                <div class="detail-row"><span class="label">User</span><span class="value">${esc(pkg.userName || 'Unknown')}</span></div>
                <div class="detail-row"><span class="label">Email</span><span class="value">${esc(pkg.userEmail || '—')}</span></div>
                <div class="detail-row"><span class="label">Package</span><span class="value" style="color:#4dc9f6;">${esc(pkg.packageName || pkg.packageId || '—')}</span></div>
                <div class="detail-row"><span class="label">Package ID</span><span class="value">${esc(pkg.packageId || '—')}</span></div>
                <div class="detail-row"><span class="label">Amount</span><span class="value gold">${amount > 0 ? '$' + amount.toFixed(2) : '—'}</span></div>
                <div class="detail-row"><span class="label">Region</span><span class="value">${esc(pkg.paymentRegion || pkg.region || '—')}</span></div>
                <div class="detail-row"><span class="label">Payment Method</span><span class="value">${esc(pkg.paymentMethod || pkg.method || '—')}</span></div>
                <div class="detail-row"><span class="label">Payment ID</span><span class="value">${esc(pkg.userNumber || pkg.upiId || pkg.walletAddress || '—')}</span></div>
                <div class="detail-row"><span class="label">Transaction ID</span><span class="value">${esc(pkg.transactionId || '—')}</span></div>
                <div class="detail-row"><span class="label">Status</span><span class="value" style="text-transform:capitalize;">${esc(rawStatus)}</span></div>
                <div class="detail-row"><span class="label">Date</span><span class="value">${esc(formatDate(pkg.createdAt))}</span></div>
                ${pkg.screenshot ? `
                    <div style="margin-top:14px;text-align:center;">
                        <a href="${esc(pkg.screenshot)}" target="_blank" rel="noopener" style="color:#4dc9f6;font-size:.75rem;">📸 View Payment Screenshot</a>
                    </div>
                ` : ''}
                ${rawStatus === 'pending' ? `
                    <div class="modal-actions">
                        <button class="btn btn-approve" onclick="approvePackage('${pkg.id}'); closeModal();">✅ Approve</button>
                        <button class="btn btn-reject" onclick="rejectPackage('${pkg.id}'); closeModal();">❌ Reject</button>
                    </div>
                ` : ''}
            `;

            modal.classList.add('show');
        }

        // ============================================================
        // CONVERT PACKAGE DURATION TO HOURS
        // ============================================================
        function durationToHours(value) {
            if (value === null || value === undefined || value === '') return 0;
            if (typeof value === 'number') return value > 0 ? value : 0;

            const text = String(value).trim().toLowerCase();
            const n = parseFloat(text.replace(',', '.'));
            if (!Number.isFinite(n) || n <= 0) return 0;
            if (text.includes('week')) return n * 24 * 7;
            if (text.includes('day')) return n * 24;
            if (text.includes('minute') || /\bmin\b/.test(text)) return n / 60;
            return n; // existing package data uses hours when unit is omitted
        }

        // ============================================================
        // APPROVE PACKAGE PAYMENT REQUEST
        // ============================================================
        async function approvePackage(requestId) {
            if (!confirm('Approve this package payment?')) return;

            try {
                const requestRef = db.collection('paymentRequests').doc(requestId);
                const requestSnap = await requestRef.get();
                if (!requestSnap.exists) throw new Error('Payment request not found.');

                const request = requestSnap.data() || {};
                if (String(request.status || 'pending').toLowerCase() !== 'pending') {
                    showToast('⚠️ This request is already ' + (request.status || 'processed') + '.', 'warning');
                    loadPackagePayments();
                    return;
                }

                const userId = request.userId;
                if (!userId || userId === 'guest') throw new Error('This package request has no valid user account.');

                // Read the package definition so admin approval always uses the
                // current package duration/price rather than a hard-coded map.
                let packageData = {};
                if (request.packageId) {
                    const packageSnap = await db.collection('packagePrices').doc('packages').get();
                    if (packageSnap.exists) {
                        packageData = packageSnap.data()?.[request.packageId] || {};
                    }
                }

                const packageName = request.packageName || packageData.name || request.packageId || 'Package';
                const durationValue = packageData.duration ?? request.duration ?? request.packageDuration ?? 0;
                const hours = durationToHours(durationValue);
                if (!hours) throw new Error('Package duration is missing or invalid for ' + packageName + '.');

                const amount = Number(request.amount ?? request.packagePrice ?? packageData.usdt ?? 0);
                const now = new Date();
                const expiryTime = new Date(now.getTime() + hours * 60 * 60 * 1000);

                // 1) Mark the payment request approved.
                await requestRef.update({
                    status: 'approved',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    packageExpiry: expiryTime
                });

                // 2) Create the actual userPackages record used by the dashboard/timer.
                await db.collection('userPackages').add({
                    userId: userId,
                    userName: request.userName || 'Player',
                    userEmail: request.userEmail || '',
                    packageId: request.packageId || '',
                    packageName: packageName,
                    amount: amount,
                    currency: request.currency || 'USD',
                    paymentMethod: request.paymentMethod || request.method || '',
                    paymentRegion: request.paymentRegion || request.region || '',
                    transactionId: request.transactionId || '',
                    screenshot: request.screenshot || '',
                    status: 'active',
                    activatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    expiryTime: expiryTime,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    sourceRequestId: requestId
                });

                // 3) Update the user's authoritative package status.
                await db.collection('users').doc(userId).set({
                    packageName: packageName,
                    packageStatus: 'active',
                    packageExpiry: expiryTime,
                    signalActive: true,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                showToast('✅ Package approved! ' + packageName + ' activated for ' + hours + ' hour(s).', 'success');
                loadPackagePayments();
            } catch (error) {
                console.error('Error approving package:', error);
                showToast('❌ Failed to approve package: ' + error.message, 'error');
            }
        }

        // ============================================================
        // REJECT PACKAGE PAYMENT REQUEST
        // ============================================================
        async function rejectPackage(requestId) {
            if (!confirm('Reject this package payment?')) return;

            try {
                const requestRef = db.collection('paymentRequests').doc(requestId);
                const requestSnap = await requestRef.get();
                if (!requestSnap.exists) throw new Error('Payment request not found.');

                await requestRef.update({
                    status: 'rejected',
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('❌ Package payment rejected', 'warning');
                loadPackagePayments();
            } catch (error) {
                console.error('Error rejecting package:', error);
                showToast('❌ Failed to reject package: ' + error.message, 'error');
            }
        }

        // ============================================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================================
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // INIT
        // ============================================================
        if (checkAdminAuth()) {
            loadPackagePayments();
            setInterval(loadPackagePayments, 30000);
        }
    </script>

</body>
