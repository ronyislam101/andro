    <div class="container">

    <script>
(function () {
    const storageKey = 'iceFishingAdminSession';
    function read(storage, key) {
        try { return storage.getItem(key); } catch (_) { return null; }
    }
    function remove(storage, key) {
        try { storage.removeItem(key); } catch (_) {}
    }
    function valid(record) {
        return record && typeof record.key === 'string' && record.key.trim() &&
            typeof record.token === 'string' && record.token.trim();
    }
    function parse(raw) {
        try { const record = JSON.parse(raw); return valid(record) ? record : null; }
        catch (_) { return null; }
    }
    function cleanLegacy() {
        for (const storage of [localStorage, sessionStorage]) {
            remove(storage, 'adminKey');
            remove(storage, 'adminToken');
        }
    }
    function save(key, token) {
        const record = { key, token };
        if (!valid(record)) throw new Error('Invalid admin session. Please login again.');
        localStorage.setItem(storageKey, JSON.stringify(record));
        cleanLegacy();
    }
    function get() { return parse(read(localStorage, storageKey)); }
    function clear() {
        for (const storage of [localStorage, sessionStorage]) {
            remove(storage, storageKey);
            remove(storage, 'adminKey');
            remove(storage, 'adminToken');
        }
    }
    // Preserve already signed-in sessions when these updated pages are installed.
    if (!get()) {
        const savedLocal = {
            key: read(localStorage, 'adminKey'),
            token: read(localStorage, 'adminToken')
        };
        const savedTab = {
            key: read(sessionStorage, 'adminKey'),
            token: read(sessionStorage, 'adminToken')
        };
        const legacy = valid(savedLocal) ? savedLocal : valid(savedTab) ? savedTab : null;
        if (legacy) {
            try { save(legacy.key, legacy.token); } catch (_) {}
        }
    } else {
        cleanLegacy();
    }
    window.AdminSession = {
        get,
        save,
        clear,
        getKey: () => { const session = get(); return session ? session.key : null; },
        getToken: () => { const session = get(); return session ? session.token : null; }
    };
})();

window.addEventListener('storage', function (event) {
    if ((event.key === 'iceFishingAdminSession' || event.key === null) && !AdminSession.get()) {
        window.location.replace('index.html');
    }
});
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig={apiKey:"AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",authDomain:"ice-fishing-c20bc.firebaseapp.com",projectId:"ice-fishing-c20bc",storageBucket:"ice-fishing-c20bc.firebasestorage.app",messagingSenderId:"220872632937",appId:"1:220872632937:android:71997f3fd7dba6293a90f8"};
        firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();
        let allPayments=[];

        function checkAdminAuth(){const k=AdminSession.getKey(),t=AdminSession.getToken();if(!k||!t){window.location.href='index.html';return false}return true}
        let toastTimer=null;
        function showToast(msg,type='success'){const toast=document.getElementById('toast'),tm=document.getElementById('toastMessage');if(toastTimer)clearTimeout(toastTimer);tm.textContent=msg;toast.className=type;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3500);}

        function loadPayments(){
            db.collection('paymentRequests').get().then(snap=>{
                allPayments=[];snap.forEach(doc=>allPayments.push({...doc.data(),id:doc.id,status:String(doc.data().status||'pending').trim().toLowerCase()}));
                allPayments.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
                updateStats();applyFilters();
            }).catch(e=>{console.error('Error loading:',e);showToast('Failed to load payments','error')});
        }

        function updateStats(){
            const total=allPayments.length,pending=allPayments.filter(p=>p.status==='pending').length,approved=allPayments.filter(p=>p.status==='approved').length,rejected=allPayments.filter(p=>p.status==='rejected').length;
            document.getElementById('totalPackages').textContent=total;document.getElementById('pendingPackages').textContent=pending;document.getElementById('approvedPackages').textContent=approved;document.getElementById('rejectedPackages').textContent=rejected;document.getElementById('packageCount').textContent='Total: '+total;
        }

        function applyFilters(){
            const sf=document.getElementById('statusFilter').value,search=document.getElementById('searchInput').value.toLowerCase();
            let filtered=allPayments;
            if(sf!=='all')filtered=filtered.filter(p=>p.status===sf);
            if(search)filtered=filtered.filter(p=>(p.userName||'').toLowerCase().includes(search)||(p.packageName||'').toLowerCase().includes(search)||(p.transactionId||'').toLowerCase().includes(search));
            renderTable(filtered);
        }

        function renderTable(items){
            const tbody=document.getElementById('packageTableBody');
            if(!items.length){tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><i class="fas fa-box"></i>No payment requests found</div></td></tr>';return}
            let html='',idx=1;
            items.forEach(p=>{
                const sc=p.status||'pending',sl=sc.charAt(0).toUpperCase()+sc.slice(1);
                const date=p.createdAt?.toDate?.()||new Date(p.createdAt);
                const ds=date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
                const method=p.paymentMethod||p.method||'—',amt=p.amount||p.packagePrice||0;
                html+=`<tr><td>${idx++}</td><td><span class="user-name">${p.userName||'Unknown'}</span></td><td><span class="package-name">${p.packageName||'—'}</span></td><td><span class="amount">$${amt}</span></td><td>${method}</td><td><span class="status-badge ${sc}">${sl}</span></td><td style="font-size:.6rem;color:rgba(255,255,255,.1)">${ds}</td><td>
                    <button class="action-btn view-btn" onclick="viewPayment('${p.id}')"><i class="fas fa-eye"></i></button>
                    <button data-manage title="Delete request" class="action-btn delete-btn" onclick="deletePayment('${p.id}')"><i class="fas fa-trash"></i></button>
                    ${p.status==='pending'?`<button class="action-btn approve-btn" onclick="approvePayment('${p.id}')"><i class="fas fa-check"></i></button><button class="action-btn reject-btn" onclick="rejectPayment('${p.id}')"><i class="fas fa-times"></i></button>`:''}
                </td></tr>`;
            });
            tbody.innerHTML=html;
        }

        function viewPayment(id){
            const p=allPayments.find(x=>x.id===id);if(!p)return;
            const modal=document.getElementById('modalOverlay'),body=document.getElementById('modalBody');
            const created=p.createdAt?.toDate?.()||new Date(),ds=created.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
            const sc=p.status||'pending',color=sc==='approved'?'#00ff88':sc==='rejected'?'#ff6b6b':'#ffa500';
            const safe=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const screenshot=paymentScreenshotSource(p);
            body.innerHTML=`
                <div class="detail-row"><span class="label">User</span><span class="value">${safe(p.userName||'Unknown')}</span></div>
                <div class="detail-row"><span class="label">Email</span><span class="value">${safe(p.userEmail||'—')}</span></div>
                <div class="detail-row"><span class="label">Package</span><span class="value" style="color:#4dc9f6;">${safe(p.packageName||'—')}</span></div>
                <div class="detail-row"><span class="label">Amount</span><span class="value gold">${safe(p.amount||p.packagePrice||0)} ${safe(p.currency||'')}</span></div>
                <div class="detail-row"><span class="label">Payment Method</span><span class="value">${safe(p.paymentMethod||'—')}</span></div>
                <div class="detail-row"><span class="label">Payment Number / UPI</span><span class="value">${safe(p.userNumber||p.upiId||p.walletAddress||'—')}</span></div>
                <div class="detail-row"><span class="label">Transaction ID</span><span class="value" style="font-family:monospace;">${safe(p.transactionId||'—')}</span></div>
                <div class="detail-row"><span class="label">Status</span><span class="value" style="color:${color};text-transform:capitalize;">${safe(sc)}</span></div>
                <div class="detail-row"><span class="label">Date</span><span class="value">${safe(ds)}</span></div>
                ${screenshot?`<div class="screenshot-box"><div class="screenshot-label"><span>📸 Screenshot</span><div class="screenshot-actions"><a href="${safe(screenshot)}" target="_blank" rel="noopener noreferrer">Open</a><button type="button" id="downloadScreenshotBtn">⬇ Download</button></div></div><img src="${safe(screenshot)}" alt="Screenshot" onerror="this.parentElement.innerHTML='<div style=\\'padding:12px;text-align:center;color:rgba(255,255,255,.3);\\'>⚠️ Screenshot not available</div>'"></div>`:''}
                <div class="key-section">
                    <div class="key-label">🔑 License Key</div>
                    <input type="text" id="licenseKeyInput" placeholder="Enter license key (will be shown to user)" value="${safe(p.licenseKey||'')}" />
                    <div class="key-hint">Enter the license key before approving. User will see this on payment status page.</div>
                </div>
                ${p.status==='pending'?`<div class="modal-actions"><button class="btn btn-approve" onclick="approvePayment('${p.id}')">✅ Approve & Save Key</button><button class="btn btn-reject" onclick="rejectPayment('${p.id}');closeModal();">❌ Reject</button></div>`:''}
            `;
            const downloadButton = document.getElementById('downloadScreenshotBtn');
            if (downloadButton) downloadButton.onclick = () => downloadPaymentScreenshot(p, downloadButton);
            modal.classList.add('show');
        }

        function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

        async function approvePayment(id){
            const input=document.getElementById('licenseKeyInput');const key=input?.value?.trim()||'';
            if(!key){showToast('❌ Enter a license key before approving.','error');input?.focus();return}
            if(!confirm('Approve this payment with license key: '+key+'?'))return;
            try{
                const ref=db.collection('paymentRequests').doc(id);const snap=await ref.get();if(!snap.exists)throw new Error('Not found');
                const data=snap.data()||{};
                await ref.update({status:'approved',licenseKey:key,approvedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
                if(data.userId&&data.userId!=='guest'){await db.collection('users').doc(data.userId).set({packageName:data.packageName||'',packageStatus:'approved',packageActivationKey:key,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
                showToast('✅ Payment approved with license key: '+key,'success');loadPayments();viewPayment(id);
            }catch(e){console.error(e);showToast('❌ Failed: '+e.message,'error')}
        }

        async function rejectPayment(id){
            if(!confirm('Reject this payment?'))return;
            try{await db.collection('paymentRequests').doc(id).update({status:'rejected',rejectedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});showToast('❌ Payment rejected','warning');loadPayments()}catch(e){showToast('❌ Failed: '+e.message,'error')}
        }

        document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});
        if(checkAdminAuth()){loadPayments();setInterval(loadPayments,30000)}
    
function paymentScreenshotSource(payment) {
    const source = String(payment.screenshot || payment.screenshotUrl || '').trim();
    if (/^data:image\/(png|jpeg|jpg|webp|gif|avif|heic|heif);base64,/i.test(source)) return source;
    try { const url = new URL(source); return ['https:', 'http:'].includes(url.protocol) ? url.href : ''; } catch (_) { return ''; }
}
function screenshotFilename(payment, type) {
    const ext = ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','image/avif':'avif','image/heic':'heic','image/heif':'heif'})[type.toLowerCase()] || 'jpg';
    return 'payment-' + String(payment.id || 'screenshot').replace(/[^a-z0-9_-]/gi, '_') + '.' + ext;
}
async function downloadPaymentScreenshot(payment, button) {
    const source = paymentScreenshotSource(payment);
    if (!source) { showToast('Screenshot is not available.', 'error'); return; }
    const original = button.textContent;
    button.disabled = true; button.textContent = 'Downloading…';
    let controller, timeout;
    try {
        const attachmentUrl = cloudinaryScreenshotDownload(source);
        if (attachmentUrl) {
            const link = document.createElement('a'); link.href = attachmentUrl;
            link.download = ''; document.body.appendChild(link); link.click(); link.remove();
            showToast('Download requested. Check your Downloads folder.');
            return;
        }
        if (typeof AbortController !== 'undefined') {
            controller = new AbortController(); timeout = setTimeout(() => controller.abort(), 20000);
        }
        let blob;
        if (source.startsWith('data:')) {
            const split = source.indexOf(',');
            const mime = source.slice(5, source.indexOf(';'));
            const bytes = atob(source.slice(split + 1).replace(/\s/g, ''));
            blob = new Blob([Uint8Array.from(bytes, char => char.charCodeAt(0))], {type:mime});
        } else {
            const response = await fetch(source, controller ? {signal:controller.signal} : {});
            if (!response.ok) throw new Error('Image could not be loaded (' + response.status + ').');
            blob = await response.blob();
        }
        if (!blob.size || !/^image\//i.test(blob.type)) throw new Error('The screenshot link did not return an image.');
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl; link.download = screenshotFilename(payment, blob.type);
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
        showToast('Download started. Check your Downloads folder.');
    } catch (error) {
        console.error('Screenshot download failed:', error);
        // Public Cloudinary images can be downloaded without a cross-origin fetch.
        const attachment = cloudinaryScreenshotDownload(source);
        if (attachment) {
            const link = document.createElement('a'); link.href = attachment;
            link.download = ''; document.body.appendChild(link); link.click(); link.remove();
            showToast('Download requested. Check your Downloads folder.');
        } else {
            showToast('Download failed. Use Open, then save the image from your browser.', 'error');
        }
    } finally {
        clearTimeout(timeout); button.disabled = false; button.textContent = original;
    }
}

function cloudinaryScreenshotDownload(source) {
    try {
        const url = new URL(source);
        if (url.hostname === 'res.cloudinary.com' && /\/image\/upload\//.test(url.pathname) && !/\/s--[^/]+--\//.test(url.pathname)) {
            url.pathname = url.pathname.replace('/image/upload/', '/image/upload/fl_attachment/');
            return url.href;
        }
    } catch (_) {}
    return '';
}

let managementBusy = false;
function recordTime(value) {
    if (!value) return 0;
    if (typeof value.toMillis === 'function') return value.toMillis();
    const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
    return Number.isFinite(date.getTime()) ? date.getTime() : 0;
}
async function manageRecords(task) {
    if (!AdminSession.get()) { window.location.replace('index.html'); return; }
    if (managementBusy) return;
    managementBusy = true;
    document.querySelectorAll('[data-manage]').forEach(button => { button.disabled = true; });
    try { await task(); }
    catch (error) { showToast('Failed: ' + error.message, 'error'); }
    finally {
        managementBusy = false;
        document.querySelectorAll('[data-manage]').forEach(button => { button.disabled = false; });
    }
}
async function deleteOneRecord(collectionName, id, label, reload) {
    return manageRecords(async () => {
        if (!confirm('Delete this ' + label + '? This cannot be undone. Deleting a request does not reverse an approved balance or package.')) return;
        await db.collection(collectionName).doc(id).delete();
        if (typeof closeModal === 'function') closeModal();
        showToast(label + ' deleted', 'warning');
        reload();
    });
}
async function deleteAllRecords(collectionName, label, reload) {
    return manageRecords(async () => {
        const snapshot = await db.collection(collectionName).get();
        if (snapshot.empty) { showToast('No ' + label + ' to delete', 'warning'); return; }
        if (!confirm('Permanently delete ALL ' + snapshot.size + ' ' + label + ', including approved records? This deletes records only; approved balances and packages are not reversed.')) return;
        let done = 0;
        try {
            for (let offset = 0; offset < snapshot.docs.length; offset += 450) {
                const docs = snapshot.docs.slice(offset, offset + 450);
                const batch = db.batch();
                docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                done += docs.length;
            }
        } catch (error) {
            reload();
            throw new Error('Deleted ' + done + ' of ' + snapshot.size + '. ' + error.message);
        }
        if (typeof closeModal === 'function') closeModal();
        showToast('Deleted ' + done + ' ' + label, 'warning');
        reload();
    });
}

function deletePayment(id) { return deleteOneRecord('paymentRequests', id, 'payment request', loadPayments); }
function deleteAllPayments() { return deleteAllRecords('paymentRequests', 'package requests', loadPayments); }
