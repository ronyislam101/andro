<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Payments - ICE FISHING Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#080c18;font-family:Inter,sans-serif;color:#fff;padding:20px}
        .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%,rgba(0,120,255,.06),transparent 55%),radial-gradient(ellipse at 50% 80%,rgba(255,215,0,.03),transparent 45%),#080c18}
        .container{position:relative;z-index:1;max-width:1100px;margin:0 auto}
        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding:16px 20px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:16px}
        .header .back-btn{padding:8px 18px;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:rgba(255,255,255,.02);color:rgba(255,255,255,.3);font-size:.7rem;font-weight:500;cursor:pointer;transition:.3s;text-decoration:none}
        .header .back-btn:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.6)}
        .header h1{font-size:1.2rem;font-weight:700;flex:1;text-align:center}
        .header h1 span{color:#4dc9f6}
        .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
        .stat-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:16px;text-align:center}
        .stat-card .number{font-size:1.6rem;font-weight:800}
        .stat-card .number.blue{color:#4dc9f6}
        .stat-card .number.green{color:#00ff88}
        .stat-card .number.orange{color:#ffa500}
        .stat-card .number.red{color:#ff6b6b}
        .stat-card .label{font-size:.55rem;font-weight:500;color:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
        .filter-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
        .filter-row select,.filter-row input{padding:10px 14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;color:#fff;font-family:Inter,sans-serif;font-size:.8rem;outline:none;transition:.3s}
        .filter-row select option{background:#080c18;color:#fff}
        .filter-row select:focus,.filter-row input:focus{border-color:rgba(77,201,246,.15)}
        .filter-row input{flex:1;min-width:200px}
        .filter-row input::placeholder{color:rgba(255,255,255,.08)}
        .table-section{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:20px 22px}
        .table-section .title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .table-section .title-row .title{font-size:.7rem;font-weight:600;color:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:2px}
        .table-section .title-row .count{font-size:.65rem;font-weight:500;color:rgba(255,255,255,.1)}
        .table-wrapper{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:.75rem}
        thead{background:rgba(255,255,255,.02)}
        th{padding:10px 12px;text-align:left;font-weight:500;color:rgba(255,255,255,.15);font-size:.55rem;text-transform:uppercase;letter-spacing:.5px}
        td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.02);color:rgba(255,255,255,.5)}
        td .user-name{color:#fff;font-weight:500}
        td .amount{color:#ffd700;font-weight:600}
        td .package-name{color:#4dc9f6;font-weight:500}
        .status-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.5rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
        .status-badge.pending{background:rgba(255,165,0,.06);color:#ffa500}
        .status-badge.approved{background:rgba(0,255,136,.06);color:#00ff88}
        .status-badge.rejected{background:rgba(255,50,50,.06);color:#ff6b6b}
        .action-btn{padding:4px 10px;border:none;border-radius:6px;font-size:.5rem;font-weight:600;cursor:pointer;transition:.3s;font-family:Inter,sans-serif}
        .action-btn.approve-btn{background:rgba(0,255,136,.06);color:#00ff88}
        .action-btn.approve-btn:hover{background:rgba(0,255,136,.12)}
        .action-btn.reject-btn{background:rgba(255,50,50,.06);color:#ff6b6b}
        .action-btn.reject-btn:hover{background:rgba(255,50,50,.12)}
        .action-btn.view-btn{background:rgba(77,201,246,.06);color:#4dc9f6}
        .action-btn.view-btn:hover{background:rgba(77,201,246,.12)}
        .empty-state{text-align:center;padding:30px 20px;color:rgba(255,255,255,.04)}
        .empty-state i{font-size:2rem;opacity:.2;margin-bottom:8px;display:block}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.show{display:flex}
        .modal{background:#0e1525;border:1px solid #1a2540;border-radius:20px;padding:30px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
        .modal .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .modal .modal-header h2{font-size:1.1rem}
        .modal .modal-header .close-btn{background:none;border:none;color:rgba(255,255,255,.3);font-size:1.2rem;cursor:pointer;transition:.3s}
        .modal .modal-header .close-btn:hover{color:#fff}
        .modal .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.02);align-items:center}
        .modal .detail-row .label{color:rgba(255,255,255,.15);font-size:.7rem}
        .modal .detail-row .value{color:#fff;font-weight:500;font-size:.8rem}
        .modal .detail-row .value.gold{color:#ffd700}
        .modal .screenshot-box{margin-top:14px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
        .modal .screenshot-box img{width:100%;max-height:400px;object-fit:contain;display:block}
        .modal .screenshot-box .screenshot-label{font-size:.6rem;color:rgba(255,255,255,.15);padding:8px 12px;background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center}
        .modal .screenshot-box .screenshot-label a{color:#4dc9f6;text-decoration:none;font-weight:600}
        .modal .key-section{margin-top:16px;padding:16px;border:1px solid rgba(77,201,246,.2);border-radius:12px;background:rgba(77,201,246,.05)}
        .modal .key-section .key-label{font-size:.65rem;font-weight:700;color:#4dc9f6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
        .modal .key-section input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0b1220;color:#fff;outline:none;font-family:monospace;font-weight:600;font-size:.85rem}
        .modal .key-section input:focus{border-color:rgba(77,201,246,.3)}
        .modal .key-section .key-hint{font-size:.6rem;color:rgba(255,255,255,.2);margin-top:4px}
        .modal .modal-actions{display:flex;gap:10px;margin-top:16px}
        .modal .modal-actions .btn{flex:1;padding:12px;border:none;border-radius:10px;font-family:Inter,sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:.3s}
        .modal .modal-actions .btn-approve{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#080c18}
        .modal .modal-actions .btn-approve:hover{transform:translateY(-2px)}
        .modal .modal-actions .btn-reject{background:linear-gradient(135deg,#ff6b6b,#cc4444);color:#fff}
        .modal .modal-actions .btn-reject:hover{transform:translateY(-2px)}
        #toast{position:fixed;top:20px;right:20px;z-index:9999;max-width:360px;padding:14px 20px;border-radius:12px;font-size:.8rem;font-weight:500;transform:translateX(120%);opacity:0;transition:.5s cubic-bezier(.23,1,.32,1);box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.04)}
        #toast.show{transform:translateX(0);opacity:1}
        #toast.success{background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.05);color:#00ff88}
        #toast.error{background:rgba(255,50,50,.08);border-color:rgba(255,50,50,.05);color:#ff6b6b}
        #toast.warning{background:rgba(255,165,0,.08);border-color:rgba(255,165,0,.05);color:#ffa500}
        @media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr)}.header{flex-wrap:wrap;gap:10px}table{font-size:.65rem}th,td{padding:6px 6px}.filter-row{flex-direction:column}.filter-row input{min-width:unset}.modal{padding:20px}}
        @media(max-width:480px){body{padding:12px}.stats-row{grid-template-columns:1fr 1fr;gap:8px}.stat-card .number{font-size:1.2rem}.header h1{font-size:1rem}.table-section{padding:14px 12px}.modal{padding:16px}.modal .detail-row{flex-direction:column;align-items:flex-start;gap:4px}.modal .modal-actions{flex-direction:column}}
    </style>
</head>
<body>
    <div class="bg"></div>
    <div id="toast"><span id="toastMessage">Toast message</span></div>
    <div class="container">
        <div class="header">
            <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>📦 <span>Package</span> Payments</h1>
            <div class="placeholder"></div>
        </div>
        <div class="stats-row" id="statsRow">
            <div class="stat-card"><div class="number blue" id="totalPackages">0</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="number orange" id="pendingPackages">0</div><div class="label">Pending</div></div>
            <div class="stat-card"><div class="number green" id="approvedPackages">0</div><div class="label">Approved</div></div>
            <div class="stat-card"><div class="number red" id="rejectedPackages">0</div><div class="label">Rejected</div></div>
        </div>
        <div class="filter-row">
            <select id="statusFilter" onchange="applyFilters()">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Search by user or package..." oninput="applyFilters()" />
        </div>
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> Payment Requests</span>
                <span class="count" id="packageCount">Total: 0</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>#</th><th>User</th><th>Package</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="packageTableBody">
                        <tr><td colspan="8"><div class="empty-state"><i class="fas fa-box"></i>No payment requests found</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Payment Details</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig={apiKey:"AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",authDomain:"ice-fishing-c20bc.firebaseapp.com",projectId:"ice-fishing-c20bc",storageBucket:"ice-fishing-c20bc.firebasestorage.app",messagingSenderId:"220872632937",appId:"1:220872632937:android:71997f3fd7dba6293a90f8"};
        firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();
        let allPayments=[];

        function checkAdminAuth(){const k=sessionStorage.getItem('adminKey'),t=sessionStorage.getItem('adminToken');if(!k||!t){window.location.href='admin-login.html';return false}return true}
        let toastTimer=null;
        function showToast(msg,type='success'){const toast=document.getElementById('toast'),tm=document.getElementById('toastMessage');if(toastTimer)clearTimeout(toastTimer);tm.textContent=msg;toast.className=type;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3500);}

        function loadPayments(){
            db.collection('paymentRequests').get().then(snap=>{
                allPayments=[];snap.forEach(doc=>allPayments.push({id:doc.id,...doc.data()}));
                allPayments.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
                updateStats();applyFilters();
            }).catch(e=>{console.error('Error loading:',e);showToast('Failed to load payments','error')});
        }

        function updateStats(){
            const total=allPayments.length,pending=allPayments.filter(p=>p.status==='pending').length,approved=allPayments.filter(p=>p.status==='approved').length,rejected=allPayments.filter(p=>p.status==='rejected').length;
            document.getElementById('totalPackages').textContent=total;document.getElementById('pendingPackages').textContent=pending;document.getElementById('approvedPackages').textContent=approved;document.getElementById('rejectedPackages').textContent=rejected;document.getElementById('packageCount').textContent='Total: '+total;
        }

        function applyFilters(){
            const sf=document.getElementById('statusFilter').value,search=document.getElementById('searchInput').value.toLowerCase();
            let filtered=allPayments;
            if(sf!=='all')filtered=filtered.filter(p=>p.status===sf);
            if(search)filtered=filtered.filter(p=>(p.userName||'').toLowerCase().includes(search)||(p.packageName||'').toLowerCase().includes(search)||(p.transactionId||'').toLowerCase().includes(search));
            renderTable(filtered);
        }

        function renderTable(items){
            const tbody=document.getElementById('packageTableBody');
            if(!items.length){tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><i class="fas fa-box"></i>No payment requests found</div></td></tr>';return}
            let html='',idx=1;
            items.forEach(p=>{
                const sc=p.status||'pending',sl=sc.charAt(0).toUpperCase()+sc.slice(1);
                const date=p.createdAt?.toDate?.()||new Date(p.createdAt);
                const ds=date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
                const method=p.paymentMethod||p.method||'—',amt=p.amount||p.packagePrice||0;
                html+=`<tr><td>${idx++}</td><td><span class="user-name">${p.userName||'Unknown'}</span></td><td><span class="package-name">${p.packageName||'—'}</span></td><td><span class="amount">$${amt}</span></td><td>${method}</td><td><span class="status-badge ${sc}">${sl}</span></td><td style="font-size:.6rem;color:rgba(255,255,255,.1)">${ds}</td><td>
                    <button class="action-btn view-btn" onclick="viewPayment('${p.id}')"><i class="fas fa-eye"></i></button>
                    ${p.status==='pending'?`<button class="action-btn approve-btn" onclick="approvePayment('${p.id}')"><i class="fas fa-check"></i></button><button class="action-btn reject-btn" onclick="rejectPayment('${p.id}')"><i class="fas fa-times"></i></button>`:''}
                </td></tr>`;
            });
            tbody.innerHTML=html;
        }

        function viewPayment(id){
            const p=allPayments.find(x=>x.id===id);if(!p)return;
            const modal=document.getElementById('modalOverlay'),body=document.getElementById('modalBody');
            const created=p.createdAt?.toDate?.()||new Date(),ds=created.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
            const sc=p.status||'pending',color=sc==='approved'?'#00ff88':sc==='rejected'?'#ff6b6b':'#ffa500';
            const safe=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const screenshot=p.screenshot||'';
            body.innerHTML=`
                <div class="detail-row"><span class="label">User</span><span class="value">${safe(p.userName||'Unknown')}</span></div>
                <div class="detail-row"><span class="label">Email</span><span class="value">${safe(p.userEmail||'—')}</span></div>
                <div class="detail-row"><span class="label">Package</span><span class="value" style="color:#4dc9f6;">${safe(p.packageName||'—')}</span></div>
                <div class="detail-row"><span class="label">Amount</span><span class="value gold">${safe(p.amount||p.packagePrice||0)} ${safe(p.currency||'')}</span></div>
                <div class="detail-row"><span class="label">Payment Method</span><span class="value">${safe(p.paymentMethod||'—')}</span></div>
                <div class="detail-row"><span class="label">Payment Number / UPI</span><span class="value">${safe(p.userNumber||p.upiId||p.walletAddress||'—')}</span></div>
                <div class="detail-row"><span class="label">Transaction ID</span><span class="value" style="font-family:monospace;">${safe(p.transactionId||'—')}</span></div>
                <div class="detail-row"><span class="label">Status</span><span class="value" style="color:${color};text-transform:capitalize;">${safe(sc)}</span></div>
                <div class="detail-row"><span class="label">Date</span><span class="value">${safe(ds)}</span></div>
                ${screenshot?`<div class="screenshot-box"><div class="screenshot-label"><span>📸 Screenshot</span><a href="${safe(screenshot)}" target="_blank">Open</a></div><img src="${safe(screenshot)}" alt="Screenshot" onerror="this.parentElement.innerHTML='<div style=\\'padding:12px;text-align:center;color:rgba(255,255,255,.3);\\'>⚠️ Screenshot not available</div>'"></div>`:''}
                <div class="key-section">
                    <div class="key-label">🔑 License Key</div>
                    <input type="text" id="licenseKeyInput" placeholder="Enter license key (will be shown to user)" value="${safe(p.licenseKey||'')}" />
                    <div class="key-hint">Enter the license key before approving. User will see this on payment status page.</div>
                </div>
                ${p.status==='pending'?`<div class="modal-actions"><button class="btn btn-approve" onclick="approvePayment('${p.id}')">✅ Approve & Save Key</button><button class="btn btn-reject" onclick="rejectPayment('${p.id}');closeModal();">❌ Reject</button></div>`:''}
            `;
            modal.classList.add('show');
        }

        function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

        async function approvePayment(id){
            const input=document.getElementById('licenseKeyInput');const key=input?.value?.trim()||'';
            if(!key){showToast('❌ Enter a license key before approving.','error');input?.focus();return}
            if(!confirm('Approve this payment with license key: '+key+'?'))return;
            try{
                const ref=db.collection('paymentRequests').doc(id);const snap=await ref.get();if(!snap.exists)throw new Error('Not found');
                const data=snap.data()||{};
                await ref.update({status:'approved',licenseKey:key,approvedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
                if(data.userId&&data.userId!=='guest'){await db.collection('users').doc(data.userId).set({packageName:data.packageName||'',packageStatus:'approved',packageActivationKey:key,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
                showToast('✅ Payment approved with license key: '+key,'success');loadPayments();viewPayment(id);
            }catch(e){console.error(e);showToast('❌ Failed: '+e.message,'error')}
        }

        async function rejectPayment(id){
            if(!confirm('Reject this payment?'))return;
            try{await db.collection('paymentRequests').doc(id).update({status:'rejected',rejectedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});showToast('❌ Payment rejected','warning');loadPayments()}catch(e){showToast('❌ Failed: '+e.message,'error')}
        }

        document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});
        if(checkAdminAuth()){loadPayments();setInterval(loadPayments,30000)}
    </script>
</body>
</html>
