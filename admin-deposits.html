<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deposits - ICE FISHING Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding: 20px;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            flex: 1;
            text-align: center;
        }

        .header h1 span {
            color: #4dc9f6;
        }

        .header .placeholder {
            width: 80px;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-card .number.blue { color: #4dc9f6; }
        .stat-card .number.green { color: #00ff88; }
        .stat-card .number.orange { color: #ffa500; }
        .stat-card .number.red { color: #ff6b6b; }

        .stat-card .label {
            font-size: 0.55rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Filter */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-row select,
        .filter-row input {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: 0.3s;
        }

        .filter-row select option {
            background: #080c18;
            color: #ffffff;
        }

        .filter-row select:focus,
        .filter-row input:focus {
            border-color: rgba(77, 201, 246, 0.15);
        }

        .filter-row input {
            flex: 1;
            min-width: 200px;
        }

        .filter-row input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }

        /* Table */
        .table-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px 22px;
        }

        .table-section .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .table-section .title-row .title {
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .table-section .title-row .count {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
        }

        td .user-name {
            color: #ffffff;
            font-weight: 500;
        }

        td .amount {
            color: #ffd700;
            font-weight: 600;
        }

        .copyable {
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .copyable:hover {
            color: #4dc9f6;
        }

        .copyable .copy-icon {
            font-size: 0.5rem;
            opacity: 0;
            transition: 0.3s;
        }

        .copyable:hover .copy-icon {
            opacity: 0.5;
        }

        .copyable.copied {
            color: #00ff88;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.pending {
            background: rgba(255, 165, 0, 0.06);
            color: #ffa500;
        }

        .status-badge.approved {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .status-badge.rejected {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .action-btn.approve-btn {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
        }

        .action-btn.approve-btn:hover {
            background: rgba(0, 255, 136, 0.12);
        }

        .action-btn.reject-btn {
            background: rgba(255, 50, 50, 0.06);
            color: #ff6b6b;
        }

        .action-btn.reject-btn:hover {
            background: rgba(255, 50, 50, 0.12);
        }

        .action-btn.view-btn {
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
        }

        .action-btn.view-btn:hover {
            background: rgba(77, 201, 246, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.04);
        }

        .empty-state i {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 8px;
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #0e1525;
            border: 1px solid #1a2540;
            border-radius: 20px;
            padding: 30px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal .modal-header h2 {
            font-size: 1.1rem;
        }

        .modal .modal-header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .modal-header .close-btn:hover {
            color: #ffffff;
        }

        .modal .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            align-items: center;
        }

        .modal .detail-row .label {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
        }

        .modal .detail-row .value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .modal .detail-row .value.gold {
            color: #ffd700;
        }

        .modal .detail-row .value.copyable {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .modal .detail-row .value.copyable:hover {
            color: #4dc9f6;
        }

        .modal .detail-row .value.copyable .copy-icon {
            font-size: 0.55rem;
            opacity: 0.2;
        }

        .modal .detail-row .value.copyable:hover .copy-icon {
            opacity: 0.8;
        }

        .modal .detail-row .value.copyable.copied {
            color: #00ff88;
        }

        .modal .screenshot-section {
            margin-top: 14px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .modal .screenshot-section img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
        }

        .modal .screenshot-section .download-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.6rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .modal .screenshot-section .download-btn:hover {
            background: rgba(77, 201, 246, 0.6);
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .modal-actions .btn-approve {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #080c18;
        }

        .modal .modal-actions .btn-approve:hover {
            transform: translateY(-2px);
        }

        .modal .modal-actions .btn-reject {
            background: linear-gradient(135deg, #ff6b6b, #cc4444);
            color: #ffffff;
        }

        .modal .modal-actions .btn-reject:hover {
            transform: translateY(-2px);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 360px;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            transform: translateX(120%);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(0, 255, 136, 0.08);
            border-color: rgba(0, 255, 136, 0.05);
            color: #00ff88;
        }

        #toast.error {
            background: rgba(255, 50, 50, 0.08);
            border-color: rgba(255, 50, 50, 0.05);
            color: #ff6b6b;
        }

        #toast.warning {
            background: rgba(255, 165, 0, 0.08);
            border-color: rgba(255, 165, 0, 0.05);
            color: #ffa500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .placeholder {
                display: none;
            }
            table {
                font-size: 0.65rem;
            }
            th, td {
                padding: 6px 6px;
            }
            .filter-row {
                flex-direction: column;
            }
            .filter-row input {
                min-width: unset;
            }
            .modal {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card .number {
                font-size: 1.2rem;
            }
            .header h1 {
                font-size: 1rem;
            }
            .table-section {
                padding: 14px 12px;
            }
            .modal {
                padding: 16px;
            }
            .modal .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .modal .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div id="toast">
        <span id="toastMessage">Toast message</span>
    </div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>💰 <span>Deposits</span></h1>
            <div class="placeholder"></div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="number blue" id="totalDeposits">0</div>
                <div class="label">Total Deposits</div>
            </div>
            <div class="stat-card">
                <div class="number orange" id="pendingDeposits">0</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="number green" id="approvedDeposits">0</div>
                <div class="label">Approved</div>
            </div>
            <div class="stat-card">
                <div class="number red" id="rejectedDeposits">0</div>
                <div class="label">Rejected</div>
            </div>
        </div>

        <!-- Filter -->
        <div class="filter-row">
            <select id="statusFilter" onchange="applyFilters()">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Search by user or transaction ID..." oninput="applyFilters()" />
        </div>

        <!-- Table -->
        <div class="table-section">
            <div class="title-row">
                <span class="title"><i class="fas fa-list"></i> Deposit Requests</span>
                <span class="count" id="depositCount">Total: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Transaction ID</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="depositTableBody">
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <i class="fas fa-credit-card"></i>
                                    No deposit requests found
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Deposit Details</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allDeposits = [];

        // ============================================================
        // CHECK ADMIN AUTH
        // ============================================================
        function checkAdminAuth() {
            const adminKey = sessionStorage.getItem('adminKey');
            const adminToken = sessionStorage.getItem('adminToken');

            if (!adminKey || !adminToken) {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimer = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            if (toastTimer) clearTimeout(toastTimer);

            toastMessage.textContent = message;
            toast.className = type;
            toast.classList.add('show');

            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // COPY TO CLIPBOARD
        // ============================================================
        function copyToClipboard(text, element) {
            if (!text || text === '—') {
                showToast('❌ Nothing to copy', 'error');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                element.classList.add('copied');
                setTimeout(() => element.classList.remove('copied'), 1500);
                showToast('✅ Copied: ' + text, 'success');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                element.classList.add('copied');
                setTimeout(() => element.classList.remove('copied'), 1500);
                showToast('✅ Copied: ' + text, 'success');
            });
        }

        // ============================================================
        // LOAD DEPOSITS
        // ============================================================
        function loadDeposits() {
            db.collection('depositRequests')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    allDeposits = [];
                    snapshot.forEach((doc) => {
                        allDeposits.push({ id: doc.id, ...doc.data() });
                    });
                    updateStats();
                    applyFilters();
                })
                .catch((error) => {
                    console.error('Error loading deposits:', error);
                });
        }

        // ============================================================
        // UPDATE STATS
        // ============================================================
        function updateStats() {
            const total = allDeposits.length;
            const pending = allDeposits.filter(d => d.status === 'pending').length;
            const approved = allDeposits.filter(d => d.status === 'approved').length;
            const rejected = allDeposits.filter(d => d.status === 'rejected').length;

            document.getElementById('totalDeposits').textContent = total;
            document.getElementById('pendingDeposits').textContent = pending;
            document.getElementById('approvedDeposits').textContent = approved;
            document.getElementById('rejectedDeposits').textContent = rejected;
            document.getElementById('depositCount').textContent = 'Total: ' + total;
        }

        // ============================================================
        // APPLY FILTERS
        // ============================================================
        function applyFilters() {
            const statusFilter = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allDeposits;

            if (statusFilter !== 'all') {
                filtered = filtered.filter(d => d.status === statusFilter);
            }

            if (search) {
                filtered = filtered.filter(d =>
                    (d.userName || '').toLowerCase().includes(search) ||
                    (d.transactionId || '').toLowerCase().includes(search) ||
                    (d.senderNumber || '').toLowerCase().includes(search) ||
                    (d.upiId || '').toLowerCase().includes(search)
                );
            }

            renderTable(filtered);
        }

        // ============================================================
        // RENDER TABLE (ALL DEPOSITS)
        // ============================================================
        function renderTable(deposits) {
            const tbody = document.getElementById('depositTableBody');

            if (deposits.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fas fa-credit-card"></i>
                                No deposit requests found
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            let index = 1;

            deposits.forEach((d) => {
                const statusClass = d.status || 'pending';
                const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                const date = d.createdAt?.toDate?.() || new Date(d.createdAt);
                const dateStr = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const method = d.method || d.paymentMethod || '—';
                const transactionId = d.transactionId || '—';

                html += `
                    <tr>
                        <td>${index++}</td>
                        <td><span class="user-name">${d.userName || 'Unknown'}</span></td>
                        <td><span class="amount">$${d.amount || 0}</span></td>
                        <td>${method}</td>
                        <td style="font-size:0.65rem; color:rgba(255,255,255,0.2);">${transactionId}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        <td style="font-size:0.6rem; color:rgba(255,255,255,0.1);">${dateStr}</td>
                        <td>
                            <button class="action-btn view-btn" onclick="viewDeposit('${d.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${d.status === 'pending' ? `
                                <button class="action-btn approve-btn" onclick="approveDeposit('${d.id}')">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="action-btn reject-btn" onclick="rejectDeposit('${d.id}')">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ============================================================
        // VIEW DEPOSIT
        // ============================================================
        function viewDeposit(docId) {
            const deposit = allDeposits.find(d => d.id === docId);
            if (!deposit) return;

            const modal = document.getElementById('modalOverlay');
            const body = document.getElementById('modalBody');

            const date = deposit.createdAt?.toDate?.() || new Date(deposit.createdAt);
            const dateStr = date.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            const statusColor = deposit.status === 'approved' ? '#00ff88' :
                deposit.status === 'rejected' ? '#ff6b6b' : '#ffa500';

            let screenshotHtml = '';
            if (deposit.screenshot) {
                screenshotHtml = `
                    <div class="screenshot-section">
                        <img src="${deposit.screenshot}" alt="Screenshot" />
                        <button class="download-btn" onclick="downloadScreenshot('${deposit.screenshot}')">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                `;
            }

            body.innerHTML = `
                <div class="detail-row">
                    <span class="label">User</span>
                    <span class="value copyable" onclick="copyToClipboard('${deposit.userName || ''}', this)">
                        ${deposit.userName || 'Unknown'}
                        <i class="fas fa-copy copy-icon"></i>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="label">Email</span>
                    <span class="value copyable" onclick="copyToClipboard('${deposit.userEmail || ''}', this)">
                        ${deposit.userEmail || '—'}
                        <i class="fas fa-copy copy-icon"></i>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="label">Amount</span>
                    <span class="value gold">$${deposit.amount || 0}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Currency</span>
                    <span class="value">${deposit.currency || 'USD'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Payment Method</span>
                    <span class="value">${deposit.method || deposit.paymentMethod || '—'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Sender Number / UPI</span>
                    <span class="value copyable" onclick="copyToClipboard('${deposit.senderNumber || ''}', this)">
                        ${deposit.senderNumber || '—'}
                        <i class="fas fa-copy copy-icon"></i>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="label">Transaction ID</span>
                    <span class="value copyable" style="color:#4dc9f6; font-family:monospace;" onclick="copyToClipboard('${deposit.transactionId || ''}', this)">
                        ${deposit.transactionId || '—'}
                        <i class="fas fa-copy copy-icon"></i>
                    </span>
                </div>
                <div class="detail-row">
                    <span class="label">Region</span>
                    <span class="value">${deposit.region || deposit.paymentRegion || '—'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Status</span>
                    <span class="value" style="color:${statusColor}; text-transform:capitalize;">${deposit.status || 'pending'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Date</span>
                    <span class="value" style="font-size:0.7rem; color:rgba(255,255,255,0.1);">${dateStr}</span>
                </div>
                ${screenshotHtml}
                ${deposit.status === 'pending' ? `
                    <div class="modal-actions">
                        <button class="btn btn-approve" onclick="approveDeposit('${deposit.id}'); closeModal();">
                            ✅ Approve
                        </button>
                        <button class="btn btn-reject" onclick="rejectDeposit('${deposit.id}'); closeModal();">
                            ❌ Reject
                        </button>
                    </div>
                ` : ''}
            `;

            modal.classList.add('show');
        }

        // ============================================================
        // DOWNLOAD SCREENSHOT
        // ============================================================
        function downloadScreenshot(url) {
            const link = document.createElement('a');
            link.href = url;
            link.download = 'screenshot-' + Date.now() + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('📸 Screenshot downloading...', 'success');
        }

        // ============================================================
        // CLOSE MODAL
        // ============================================================
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // ============================================================
        // APPROVE DEPOSIT
        // ============================================================
        async function approveDeposit(docId) {
            if (!confirm('Approve this deposit request?')) return;

            try {
                const docRef = db.collection('depositRequests').doc(docId);
                const doc = await docRef.get();
                const data = doc.data();

                await docRef.update({
                    status: 'approved',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                if (data.userId) {
                    // Some users are created in RTDB first, so the matching
                    // Firestore users/{uid} document may not exist yet.
                    // update() fails in that case; set(..., {merge:true})
                    // creates it safely while preserving existing fields.
                    await db.collection('users').doc(data.userId).set({
                        uid: data.userId,
                        name: data.userName || 'Player',
                        userName: data.userName || 'Player',
                        email: data.userEmail || '',
                        walletBalance: firebase.firestore.FieldValue.increment(Number(data.amount) || 0),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                } else if (data.userEmail) {
                    // Legacy requests may have no userId. Try to locate the
                    // Firestore user by email before giving up.
                    const userSnap = await db.collection('users')
                        .where('email', '==', data.userEmail)
                        .limit(1)
                        .get();

                    if (!userSnap.empty) {
                        await userSnap.docs[0].ref.set({
                            walletBalance: firebase.firestore.FieldValue.increment(Number(data.amount) || 0),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                    } else {
                        throw new Error('User account could not be found for this deposit.');
                    }
                } else {
                    throw new Error('Deposit has no userId or userEmail, so wallet cannot be credited.');
                }

                showToast('✅ Deposit approved! $' + (Number(data.amount) || 0).toFixed(2) + ' added to wallet.', 'success');
                loadDeposits();
            } catch (error) {
                console.error('Error approving deposit:', error);
                showToast('❌ Failed to approve deposit: ' + error.message, 'error');
            }
        }

        // ============================================================
        // REJECT DEPOSIT
        // ============================================================
        async function rejectDeposit(docId) {
            if (!confirm('Reject this deposit request?')) return;

            try {
                await db.collection('depositRequests').doc(docId).update({
                    status: 'rejected',
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('❌ Deposit rejected', 'warning');
                loadDeposits();
            } catch (error) {
                console.error('Error rejecting deposit:', error);
                showToast('❌ Failed to reject deposit: ' + error.message, 'error');
            }
        }

        // ============================================================
        // CLOSE MODAL ON OVERLAY CLICK
        // ============================================================
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // INIT
        // ============================================================
        if (checkAdminAuth()) {
            loadDeposits();
            setInterval(loadDeposits, 30000);
        }
    </script>

</body>
</html>
